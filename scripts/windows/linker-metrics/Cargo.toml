[package]
name = "gitcomet-linker-metrics"
version = "0.1.0"
edition = "2024"
publish = false

# This tool is intentionally independent of the application workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_IO",
    "Win32_System_ProcessStatus", "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
strip = "debuginfo"

