[package]
name = "gitcomet-git-gix"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
benchmarks = ["gitcomet-core/benchmarks"]

[[example]]
name = "status-refresh-bench"
required-features = ["benchmarks"]

[[example]]
name = "operation-context-probe"
required-features = ["benchmarks"]

# Cargo builds this fixture for integration tests. Application packages depend
# only on this package's library, so it is not part of application distributions.
[[bin]]
name = "gitcomet-test-mergetool"
path = "tests/support/mergetool_helper.rs"
test = false
bench = false
doc = false

[dependencies]
gitcomet-core = { workspace = true }
gix = { workspace = true }
lru = { workspace = true }
memchr = { workspace = true }
rustc-hash = { workspace = true }
rustix = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
gitcomet-core = { workspace = true, features = ["test-support", "benchmarks"] }
syn = { version = "3", features = ["full", "visit"] }
