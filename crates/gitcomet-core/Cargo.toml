[package]
name = "gitcomet-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
test-support = ["gitcomet-base/test-support"]
# The Levenshtein comparison benchmarks also measure strsim.
benchmarks = ["gitcomet-base/benchmarks", "dep:strsim"]

[dependencies]
uuid = { workspace = true }
gitcomet-base = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
faster-hex = { workspace = true }
fnv = { workspace = true }
gix-quote = { workspace = true }
gix-validate = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
memchr = { workspace = true }
percent-encoding = { workspace = true }
process-wrap = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
strsim = { workspace = true, optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

# The deletion date in a freedesktop trash record. Windows and macOS use their
# native trash instead.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
jiff = { workspace = true }

# macOS compiles the freedesktop trash code for its tests only.
[target.'cfg(target_os = "macos")'.dev-dependencies]
jiff = { workspace = true }

[dev-dependencies]
filetime = { workspace = true }
# Make the shared fixture helpers available to this crate's integration tests.
gitcomet-core = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
# A test oracle for the scratch Levenshtein distance.
strsim = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
gitcomet-filesystem-native = { workspace = true }
