[package]
name = "gitcomet-tree-sitter-alloc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# No `[lints] workspace = true` here, deliberately. The workspace sets
# `unsafe_code = "forbid"`, and `forbid` cannot be relaxed by a crate-level
# `allow` -- that is what separates it from `deny` -- so inheriting would make
# this crate unbuildable. Its whole job is the `extern "C"` allocator hooks
# tree-sitter calls, and `#[ctor]` expands to an `allow(unsafe_code)` of its own.
# CI names this crate explicitly on the clippy line instead.

[dependencies]
ctor = { workspace = true }
libmimalloc-sys = { workspace = true }
tree-sitter = { workspace = true }

# A small grammar, only so the tests below can actually allocate through
# tree-sitter rather than assert about the hooks in the abstract.
[dev-dependencies]
tree-sitter-json = { workspace = true }
