[package]
name = "gitcomet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["ui-gpui", "gix"]
ui = ["ui-gpui"]
ui-gpui-runtime = [
    "dep:gitcomet-ui-gpui",
    "dep:gitcomet-win32-window-utils",
    "dep:sysinfo",
]
ui-gpui = ["ui-gpui-runtime"]
gix = ["dep:gitcomet-git-gix"]

[dependencies]
clap = { workspace = true }
gitcomet-core = { workspace = true }
gitcomet-git = { workspace = true }
gitcomet-git-gix = { workspace = true, optional = true }
gitcomet-state = { workspace = true }
gitcomet-ui-gpui = { workspace = true, optional = true }
log = { workspace = true }
mimalloc = { workspace = true }
gitcomet-tree-sitter-alloc = { path = "../gitcomet-tree-sitter-alloc" }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true, optional = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
gitcomet-win32-window-utils = { path = "../win32-window-utils", optional = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[[bin]]
name = "perf-app-launch"
path = "src/bin/perf_app_launch.rs"
required-features = ["ui-gpui-runtime"]
