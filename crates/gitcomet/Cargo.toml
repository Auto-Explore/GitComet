[package]
name = "gitcomet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["ui-gpui", "gix"]
ui = ["ui-gpui"]
ui-gpui-runtime = ["gitcomet-app/ui-gpui-runtime", "dep:gitcomet-ui-gpui"]
ui-gpui = ["ui-gpui-runtime"]
gix = ["gitcomet-app/gix", "dep:gitcomet-git-gix"]
perf-alloc = ["ui-gpui", "gitcomet-ui-gpui/perf-alloc"]

[dependencies]
gitcomet-app = { workspace = true }
rustfs-mimalloc = { workspace = true }
# `perf-app-launch` only.
gitcomet-core = { workspace = true }
gitcomet-git-gix = { workspace = true, optional = true }
gitcomet-ui-gpui = { workspace = true, optional = true }
process-wrap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
gitcomet-core = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[[bin]]
name = "perf-app-launch"
path = "src/bin/perf_app_launch.rs"
required-features = ["ui-gpui-runtime"]
