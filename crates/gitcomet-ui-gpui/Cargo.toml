[package]
name = "gitcomet-ui-gpui"
build = "build.rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
perf-alloc = []
benchmarks = [
    "gitcomet-ui-kit/benchmarks",
    "gitcomet-core/benchmarks",
    "gitcomet-state/benchmarks",
    "gitcomet-state/test-support",
    "gitcomet-git-gix/benchmarks",
    "dep:gitcomet-git-gix",
    "dep:gitcomet-perf",
    "gitcomet-conflict-resolver/benchmarks",
    "gitcomet-markdown/benchmarks",
    "gitcomet-ui-media/benchmarks",
    "gitcomet-syntax/benchmarks",
    "gpui/test-support",
]

[dependencies]
alacritty_terminal = { workspace = true }
fontdb = { workspace = true }
futures = { workspace = true }
gitcomet-conflict-resolver = { workspace = true }
gitcomet-core = { workspace = true }
gitcomet-diagrams = { workspace = true }
gitcomet-extension-api = { workspace = true }
gitcomet-markdown = { workspace = true }
gitcomet-git-gix = { workspace = true, optional = true }
gitcomet-perf = { workspace = true, optional = true }
gitcomet-state = { workspace = true }
gitcomet-syntax = { workspace = true }
gitcomet-text = { workspace = true }
gitcomet-tree-sitter-alloc = { workspace = true }
gitcomet-ui-kit = { workspace = true }
gitcomet-ui-media = { workspace = true }
gitcomet-ui-terminal = { workspace = true }
# `ui_probe` uses GPUI's opt-in frame event collector in normal app builds.
gpui = { workspace = true, features = ["profiler"] }
gpui_platform = { workspace = true }
image = { workspace = true }
fast_image_resize = { workspace = true }
jiff = { workspace = true }
lru = { workspace = true }
memchr = { workspace = true }
palette = { workspace = true }
pulldown-cmark = { workspace = true }
unicode-normalization = { workspace = true }
regex = { workspace = true }
raw-window-handle = { workspace = true }
rustc-hash = { workspace = true }
rustfs-mimalloc = { workspace = true }
resvg = { workspace = true }
semver = { workspace = true }
# Actions with data (extension commands, macOS menus) derive `JsonSchema`.
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shlex = "2"
smallvec = { workspace = true }
smol = { workspace = true }
stats_alloc = { workspace = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
ureq = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Used to SIGTERM the terminal child process group on Linux and macOS.
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_wgpu = { workspace = true }
x11-clipboard = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { workspace = true, features = ["windows-wgpu"] }
gpui_wgpu = { workspace = true }

[dev-dependencies]
gitcomet-diagrams = { workspace = true, features = ["test-support"] }
# Activate the optional backend for history activation tests with real Git data.
gitcomet-git-gix = { workspace = true }
# Activate the optional sidecar writer for the measurement tests.
gitcomet-perf = { workspace = true }
gitcomet-conflict-resolver = { workspace = true, features = ["test-support"] }
gitcomet-markdown = { workspace = true, features = ["test-support"] }
gitcomet-syntax = { workspace = true, features = ["test-support"] }
# Only entries that add features over `[dependencies]` belong here — a plain
# restatement is dead weight, since tests already see every regular dependency.
gitcomet-core = { workspace = true, features = ["test-support", "benchmarks"] }
# The example product's extension, run against the real host.
gitcomet-extension-example = { path = "../gitcomet-extension-example" }
gitcomet-state = { workspace = true, features = ["test-support"] }
gitcomet-text = { workspace = true, features = ["test-support"] }
gitcomet-ui-kit = { workspace = true, features = ["test-support"] }
gitcomet-ui-media = { workspace = true, features = ["test-support"] }
gitcomet-ui-terminal = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
criterion = { workspace = true }

[build-dependencies]
resvg = { workspace = true }

[[bench]]
name = "performance"
harness = false
required-features = ["benchmarks"]
