[package]
name = "gitcomet-extension-example-app"
description = "Runnable example product: GitComet's launch with another identity."
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
gitcomet-app = { workspace = true, features = ["ui-gpui", "gix"] }
gitcomet-core = { workspace = true }
gitcomet-extension-example = { path = "../gitcomet-extension-example" }

[dev-dependencies]
gitcomet-ui-gpui = { workspace = true }
gitcomet-ui-kit = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "comet-example"
path = "src/main.rs"
