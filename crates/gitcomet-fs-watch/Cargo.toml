[package]
name = "gitcomet-fs-watch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Native FSEvents ownership is isolated here, like gitcomet-tree-sitter-alloc.
# Application crates continue to inherit the workspace unsafe_code = forbid.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[features]
test-support = ["dep:windows-sys"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
notify = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFString", "CFURL"] }
objc2-core-services = { workspace = true, features = ["std", "FSEvents", "dispatch2"] }
dispatch2 = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
notify = { workspace = true }
tempfile = { workspace = true }
