<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true" focusable="false">
  <!-- Static website light hero: main.css light body/hero decorations.
       The rounded triangle is the website's decor-triangle.svg path. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e7f3fd" />
      <stop offset="70%" stop-color="#ffffff" />
    </linearGradient>
    <radialGradient id="top-sky" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1360 -90) scale(1923 1400)">
      <stop offset="0%" stop-color="#5ac1fe" stop-opacity="0.25" />
      <stop offset="55%" stop-color="#5ac1fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blue-wash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1475 26) scale(754 379)">
      <stop offset="0%" stop-color="#5ac1fe" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#5ac1fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lilac-wash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(-33 338) scale(595 312)">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="peach-wash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1633 718) scale(675 335)">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.13" />
      <stop offset="70%" stop-color="#fdba74" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mint-wash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(46 896) scale(556 290)">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.13" />
      <stop offset="70%" stop-color="#6ee7b7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gold-wash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(919 517) scale(476 246)">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.07" />
      <stop offset="70%" stop-color="#facc15" stop-opacity="0" />
    </radialGradient>
    <path id="triangle" d="M52 18H188Q225 18 207 51L141 195Q120 232 99 195L33 51Q15 18 52 18Z" />
  </defs>
  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#top-sky)" />
  <rect width="1600" height="900" fill="url(#gold-wash)" />
  <rect width="1600" height="900" fill="url(#mint-wash)" />
  <rect width="1600" height="900" fill="url(#peach-wash)" />
  <rect width="1600" height="900" fill="url(#lilac-wash)" />
  <rect width="1600" height="900" fill="url(#blue-wash)" />
  <g fill="none" stroke-width="2">
    <circle cx="80" cy="522" r="13" stroke="#5ac1fe" stroke-opacity="0.28" />
    <circle cx="1520" cy="306" r="16" stroke="#fdba74" stroke-opacity="0.28" />
  </g>
  <use xlink:href="#triangle" fill="#eee6f5" transform="translate(120 72) scale(1.2) rotate(-24 120 120)" />
  <use xlink:href="#triangle" fill="#fbe5eb" transform="translate(1273 684) scale(0.864) rotate(16 120 120)" />
  <circle cx="192" cy="738" r="13" fill="#d5edf9" />
  <circle cx="1408" cy="162" r="18" fill="#fbe5eb" />
  <circle cx="352" cy="819" r="19" fill="#fbefd8" />
</svg>
