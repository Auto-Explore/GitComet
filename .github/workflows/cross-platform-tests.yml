name: Cross-Platform Tests

on:
  workflow_call:
    inputs:
      watcher-stress:
        type: boolean
        default: false
      cold-cache:
        type: boolean
        default: false
      test-schedule:
        description: Test scheduling candidate (keep serial until measured)
        type: string
        default: serial
      execution-samples:
        description: Uninstrumented repetitions for runtime measurement (1 is normal CI)
        type: number
        default: 1
      nextest-threads:
        description: Optional positive nextest concurrency (serial schedule only)
        type: string
        default: ''
      nextest-profile:
        description: Optional limit for concurrent Git-heavy tests
        type: string
        default: ci
      ui-threads:
        description: Optional positive UI libtest concurrency (serial schedule only)
        type: string
        default: ''
      fixture-timings:
        description: Collect per-test fixture and subprocess timings
        type: boolean
        default: false
      application-probe:
        description: Compare raw Git and GitComet latency in ci-test and release
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      watcher-stress:
        description: Repeat native watcher synchronization and lifecycle tests ten times
        type: boolean
        default: false
      cold-cache:
        description: Bypass dependency caches
        type: boolean
        default: false
      test-schedule:
        description: Test scheduling candidate (keep serial until measured)
        type: choice
        options: [serial, balanced]
        default: serial
      execution-samples:
        description: Uninstrumented repetitions for runtime measurement (1 is normal CI)
        type: number
        default: 1
      nextest-threads:
        description: Optional positive nextest concurrency (serial schedule only)
        type: string
        default: ''
      nextest-profile:
        description: Optional limit for concurrent Git-heavy tests
        type: choice
        options: [ci, ci-git-limited]
        default: ci
      ui-threads:
        description: Optional positive UI libtest concurrency (serial schedule only)
        type: string
        default: ''
      fixture-timings:
        description: Collect per-test fixture and subprocess timings
        type: boolean
        default: false
      application-probe:
        description: Compare raw Git and GitComet latency in ci-test and release
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI_EXECUTION_SAMPLES: ${{ inputs.execution-samples || 1 }}
  CI_NEXTEST_THREADS: ${{ inputs.nextest-threads || '' }}
  CI_NEXTEST_PROFILE: ${{ inputs.nextest-profile || 'ci' }}
  CI_UI_THREADS: ${{ inputs.ui-threads || '' }}
  CI_TEST_SCHEDULE: ${{ inputs.test-schedule || 'serial' }}
  GITCOMET_CI_FIXTURE_TIMINGS: ${{ inputs.fixture-timings && format('{0}/target/ci-reports/fixture-timings', github.workspace) || '' }}

jobs:
  native:
    name: Native Tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ (inputs.execution-samples > 1 || inputs.application-probe) && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu22-x64
            runner: ubuntu-22.04
            host: x86_64-unknown-linux-gnu
          - name: ubuntu22-arm64
            runner: ubuntu-22.04-arm
            host: aarch64-unknown-linux-gnu
          - name: macos15-arm64
            runner: macos-15
            host: aarch64-apple-darwin
          - name: macos26-arm64
            runner: macos-26
            host: aarch64-apple-darwin
          - name: macos15-x64
            runner: macos-15-intel
            host: x86_64-apple-darwin
          - name: windows-x64
            runner: windows-latest
            host: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            host: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config git-lfs libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          pkg-config --modversion xcb xkbcommon xkbcommon-x11
      - name: Ensure macOS Git LFS
        if: runner.os == 'macOS'
        run: |
          if ! git lfs version; then brew install git-lfs; fi
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          context: ${{ matrix.name }}-workspace-ci-test
          cold-cache: ${{ inputs.cold-cache }}
      - name: Verify host and test prerequisites
        shell: bash
        timeout-minutes: 2
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          git --version
          git lfs version
          rustc -vV
          if [[ "$RUNNER_OS" == Windows ]]; then
            git -c 'alias.gitcomet-ci-shell=!exit 0' gitcomet-ci-shell
            sh -lc 'exit 0'
          fi
          python3 -c 'import os, subprocess; version = subprocess.check_output(["rustc", "-vV"], text=True); assert "host: " + os.environ["EXPECTED_HOST"] in version, version'
      - name: Verify Windows CI subprocess handling
        if: runner.os == 'Windows'
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Compile and inventory workspace tests
        run: python3 scripts/ci/run.py compile --context workspace
      - name: Execute workspace tests
        id: tests
        shell: bash
        run: |
          args=(--nextest-profile "$CI_NEXTEST_PROFILE")
          if [[ -n "$CI_NEXTEST_THREADS" ]]; then args+=(--nextest-threads "$CI_NEXTEST_THREADS"); fi
          if [[ -n "$CI_UI_THREADS" ]]; then args+=(--ui-threads "$CI_UI_THREADS"); fi
          if [[ "$CI_EXECUTION_SAMPLES" == 1 ]]; then
            python3 scripts/ci/run.py test --context workspace --schedule "$CI_TEST_SCHEDULE" "${args[@]}"
          else
            python3 scripts/ci/runtime.py target/ci-reports/runtime --samples "$CI_EXECUTION_SAMPLES" --schedule "$CI_TEST_SCHEDULE" "${args[@]}"
          fi
      - name: Stress native watcher synchronization
        if: success() && inputs.watcher-stress
        shell: bash
        env:
          GITCOMET_TEST_SYNC_TRACE: "1"
        run: |
          args=()
          if [[ -n "$CI_NEXTEST_THREADS" ]]; then args+=(--test-threads "$CI_NEXTEST_THREADS"); fi
          python3 scripts/ci/run.py command --name watcher-stress -- \
            cargo nextest run \
            --binaries-metadata target/ci-reports/workspace/binaries.json \
            --cargo-metadata target/ci-reports/workspace/cargo.json \
            --profile ci-watch-stress --stress-count 10 --no-tests=fail "${args[@]}" \
            -E 'package(=gitcomet-fs-watch) | (package(=gitcomet-state) & (test(native_sync_) | test(native_barrier_) | test(::selective::synchronization::) | test(::selective::native_lifecycle::) | test(::selective::path_identities::)))'
      - name: Workspace doctests
        if: success() || (failure() && steps.tests.outcome == 'failure')
        shell: bash
        run: python3 scripts/ci/run.py doc --context workspace
      # The workspace enables the UI's default features and runs its complete
      # suite. Only the headless app needs a separate feature context for smoke.
      - name: Compile Linux display-selection app context
        if: success() && matrix.name == 'ubuntu22-x64'
        shell: bash
        run: |
          python3 scripts/ci/run.py compile --context app
      - name: All Linux display profiles
        if: success() && matrix.name == 'ubuntu22-x64'
        shell: bash
        run: python3 scripts/ci/run.py display
      - name: Compile original Windows CMD smoke context
        if: success() && runner.os == 'Windows'
        shell: pwsh
        run: python3 scripts/ci/run.py compile --context app
      - name: Standalone smoke test in CMD
        if: success() && runner.os == 'Windows'
        shell: cmd
        run: python3 scripts/ci/run.py cmd-smoke
      - name: Show path behavior (PowerShell and Git Bash)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "PowerShell path: $pwd"
          bash -lc "pwd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show path behavior (CMD and Git Bash)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo CMD path: %CD%
          bash -lc "pwd"
      - name: Gatekeeper and code-signing check (informational)
        if: success() && runner.os == 'macOS'
        shell: bash
        run: |
          cargo_config_output="$(scripts/macos-cargo-config.sh "$(uname -m)" release)"
          args=()
          if [[ -n "$cargo_config_output" ]]; then
            while IFS= read -r arg; do args+=("$arg"); done <<<"$cargo_config_output"
          fi
          python3 scripts/ci/run.py command --name macos-release-signing-build -- cargo build "${args[@]}" -p gitcomet --no-default-features --features gix --release --locked
          codesign --verify --verbose target/release/gitcomet || true
          spctl --assess --type execute --verbose target/release/gitcomet || true
      - name: Measure GitComet application overhead
        if: inputs.application-probe
        run: python3 scripts/ci/application-probe.py
      - uses: ./.github/actions/ci-finish
        if: always()
        with:
          name: ${{ matrix.name }}
          source-writer: ${{ matrix.name == 'ubuntu22-x64' || matrix.name == 'macos15-arm64' || matrix.name == 'windows-x64' }}
          source-key: ${{ steps.setup.outputs.source-key }}
          source-hit: ${{ steps.setup.outputs.source-hit }}
          cache-key: ${{ steps.setup.outputs.cache-key }}
          cache-hit: ${{ steps.setup.outputs.cache-hit }}
          cold-cache: ${{ inputs.cold-cache }}
          # Ubuntu x64 and Windows also compile the headless app context.
          # Keep the total active cache set below 8 GB.
          budget-mib: ${{ matrix.name == 'ubuntu22-x64' && '1200' || (runner.os == 'Windows' && '800' || '700') }}

  fedora:
    name: Linux Headless Suite (Fedora container)
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ (inputs.execution-samples > 1 || inputs.application-probe) && 180 || 60 }}
    container:
      image: fedora:41
    steps:
      - name: Install native dependencies
        run: |
          dnf -y install bash curl findutils fontconfig-devel gcc gcc-c++ git git-lfs make openssl-devel pkg-config tar which python3 libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel
          pkg-config --libs --cflags fontconfig
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          context: fedora41-x64-workspace-ci-test
          cold-cache: ${{ inputs.cold-cache }}
          python: "false"
      - name: Verify test prerequisites
        run: |
          git --version
          git lfs version
      - name: Compile and inventory workspace tests
        run: python3 scripts/ci/run.py compile --context workspace
      - name: Execute workspace tests
        id: tests
        shell: bash
        run: |
          args=(--nextest-profile "$CI_NEXTEST_PROFILE")
          if [[ -n "$CI_NEXTEST_THREADS" ]]; then args+=(--nextest-threads "$CI_NEXTEST_THREADS"); fi
          if [[ -n "$CI_UI_THREADS" ]]; then args+=(--ui-threads "$CI_UI_THREADS"); fi
          if [[ "$CI_EXECUTION_SAMPLES" == 1 ]]; then
            python3 scripts/ci/run.py test --context workspace --schedule "$CI_TEST_SCHEDULE" "${args[@]}"
          else
            python3 scripts/ci/runtime.py target/ci-reports/runtime --samples "$CI_EXECUTION_SAMPLES" --schedule "$CI_TEST_SCHEDULE" "${args[@]}"
          fi
      - name: Workspace doctests
        if: success() || (failure() && steps.tests.outcome == 'failure')
        run: python3 scripts/ci/run.py doc --context workspace
      - name: Measure GitComet application overhead
        if: inputs.application-probe
        run: python3 scripts/ci/application-probe.py
      - uses: ./.github/actions/ci-finish
        if: always()
        with:
          name: fedora41-x64
          cache-key: ${{ steps.setup.outputs.cache-key }}
          cache-hit: ${{ steps.setup.outputs.cache-hit }}
          cold-cache: ${{ inputs.cold-cache }}
