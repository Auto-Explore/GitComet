name: Deploy Microsoft Store Submission

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
      package_base_url:
        required: false
        type: string
        default: "https://apt.gitcomet.dev/windows"
      product_id:
        required: false
        type: string
        default: ""
      package_languages:
        required: false
        type: string
        default: "en"
      store_listing_languages:
        required: false
        type: string
        default: "en"
      dry_run:
        required: false
        type: boolean
        default: false
      store_preflight:
        required: false
        type: boolean
        default: false
    secrets:
      MICROSOFT_STORE_TENANT_ID:
        required: false
      MICROSOFT_STORE_CLIENT_ID:
        required: false
      MICROSOFT_STORE_CLIENT_SECRET:
        required: false
      MICROSOFT_STORE_SELLER_ID:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0 or v0.2.0)"
        required: true
        type: string
      tag:
        description: "Optional tag override (e.g. v0.2.0). Defaults to v<version>."
        required: false
        type: string
      package_base_url:
        description: "Public base URL used for the hosted MSIs. The workflow appends both x64 and arm64 MSI file names to this base URL."
        required: false
        default: "https://apt.gitcomet.dev/windows"
        type: string
      product_id:
        description: "Microsoft Store product id. Defaults to repository variable MICROSOFT_STORE_PRODUCT_ID when omitted."
        required: false
        default: ""
        type: string
      package_languages:
        description: "Comma- or space-separated package language codes. Defaults to repository variable MICROSOFT_STORE_PACKAGE_LANGUAGES or en."
        required: false
        default: "en"
        type: string
      store_listing_languages:
        description: "Comma-separated Store listing languages to fetch one at a time when updating listing metadata. Defaults to repository variable MICROSOFT_STORE_LISTING_LANGUAGES or en."
        required: false
        default: "en"
        type: string
      dry_run:
        description: "Validate the hosted MSI URLs, GitHub release notes, and generated submission payload without submitting to Microsoft Store"
        required: true
        default: false
        type: boolean
      store_preflight:
        description: "Use live Store credentials to validate listing access and metadata generation without updating packages, metadata, or publishing"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-microsoft-store-${{ inputs.tag || github.event.inputs.tag || inputs.version || github.event.inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Submit Windows MSI update to Microsoft Store
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize inputs
        id: norm
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          INPUT_PACKAGE_BASE_URL: ${{ inputs.package_base_url }}
          DISPATCH_PACKAGE_BASE_URL: ${{ github.event.inputs.package_base_url }}
          VAR_PACKAGE_BASE_URL: ${{ vars.MICROSOFT_STORE_PACKAGE_BASE_URL }}
          INPUT_PRODUCT_ID: ${{ inputs.product_id }}
          DISPATCH_PRODUCT_ID: ${{ github.event.inputs.product_id }}
          VAR_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID }}
          INPUT_PACKAGE_LANGUAGES: ${{ inputs.package_languages }}
          DISPATCH_PACKAGE_LANGUAGES: ${{ github.event.inputs.package_languages }}
          VAR_PACKAGE_LANGUAGES: ${{ vars.MICROSOFT_STORE_PACKAGE_LANGUAGES }}
          INPUT_STORE_LISTING_LANGUAGES: ${{ inputs.store_listing_languages }}
          DISPATCH_STORE_LISTING_LANGUAGES: ${{ github.event.inputs.store_listing_languages }}
          VAR_STORE_LISTING_LANGUAGES: ${{ vars.MICROSOFT_STORE_LISTING_LANGUAGES }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_STORE_PREFLIGHT: ${{ inputs.store_preflight }}
          DISPATCH_STORE_PREFLIGHT: ${{ github.event.inputs.store_preflight }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-${DISPATCH_TAG:-}}"
          version="${INPUT_VERSION:-${DISPATCH_VERSION:-}}"
          package_base_url="${INPUT_PACKAGE_BASE_URL:-${DISPATCH_PACKAGE_BASE_URL:-${VAR_PACKAGE_BASE_URL:-https://apt.gitcomet.dev/windows}}}"
          product_id="${INPUT_PRODUCT_ID:-${DISPATCH_PRODUCT_ID:-${VAR_PRODUCT_ID:-}}}"
          package_languages="${INPUT_PACKAGE_LANGUAGES:-${DISPATCH_PACKAGE_LANGUAGES:-${VAR_PACKAGE_LANGUAGES:-en}}}"
          store_listing_languages="${INPUT_STORE_LISTING_LANGUAGES:-${DISPATCH_STORE_LISTING_LANGUAGES:-${VAR_STORE_LISTING_LANGUAGES:-en}}}"
          dry_run="${INPUT_DRY_RUN:-${DISPATCH_DRY_RUN:-false}}"
          store_preflight="${INPUT_STORE_PREFLIGHT:-${DISPATCH_STORE_PREFLIGHT:-false}}"

          tag="$(echo "$tag" | tr -d '[:space:]')"
          version="$(echo "$version" | tr -d '[:space:]')"
          package_base_url="$(echo "$package_base_url" | sed 's/[[:space:]]*$//;s#/*$##')"
          product_id="$(echo "$product_id" | tr -d '[:space:]')"
          package_languages="$(echo "$package_languages" | tr '\n' ' ' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          store_listing_languages="$(echo "$store_listing_languages" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          dry_run="$(echo "$dry_run" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          store_preflight="$(echo "$store_preflight" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          if [ -z "$tag" ] && [ -z "$version" ]; then
            echo "::error title=Missing release metadata::Provide at least version or tag."
            exit 1
          fi

          if [ -n "$tag" ] && [[ "$tag" != v* ]]; then
            tag="v${tag}"
          fi

          if [ -z "$version" ]; then
            version="${tag#v}"
          fi
          version="${version#v}"

          if [ -z "$tag" ]; then
            tag="v${version}"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error title=Invalid version::Expected semver like 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi

          if [ "$tag" != "v${version}" ]; then
            echo "::error title=Tag/version mismatch::Tag '$tag' does not match version '$version'."
            exit 1
          fi

          if [[ "$dry_run" != "true" && "$dry_run" != "false" ]]; then
            echo "::error title=Invalid dry_run::dry_run must be true or false."
            exit 1
          fi

          if [[ "$store_preflight" != "true" && "$store_preflight" != "false" ]]; then
            echo "::error title=Invalid store_preflight::store_preflight must be true or false."
            exit 1
          fi

          if [ "$dry_run" = "true" ] && [ "$store_preflight" = "true" ]; then
            echo "::error title=Conflicting validation modes::dry_run and store_preflight cannot both be true."
            exit 1
          fi

          if [ -z "$package_base_url" ]; then
            echo "::error title=Missing package base URL::package_base_url is required to derive the hosted MSI URL."
            exit 1
          fi

          if ! [[ "$package_base_url" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error title=Invalid package base URL::package_base_url must be an absolute http(s) URL."
            exit 1
          fi

          if [ -z "$product_id" ] && [ "$dry_run" != "true" ]; then
            echo "::error title=Missing Microsoft Store product id::Set MICROSOFT_STORE_PRODUCT_ID or pass product_id for live submission."
            exit 1
          fi

          x64_installer_name="gitcomet-v${version}-windows-x86_64.msi"
          arm64_installer_name="gitcomet-v${version}-windows-arm64.msi"
          x64_package_url="${package_base_url}/${x64_installer_name}"
          arm64_package_url="${package_base_url}/${arm64_installer_name}"

          declare -a languages=()
          language_tokens="${package_languages//,/ }"
          for language in $language_tokens; do
            language="$(echo "$language" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            [ -n "$language" ] || continue
            if ! [[ "$language" =~ ^[a-z]{2,3}(-[a-z0-9]{2,8})*$ ]]; then
              echo "::error title=Invalid package language::language '$language' is not a valid BCP-47-ish language tag."
              exit 1
            fi
            duplicate=0
            for existing in "${languages[@]}"; do
              if [ "$existing" = "$language" ]; then
                duplicate=1
                break
              fi
            done
            if [ "$duplicate" -eq 0 ]; then
              languages+=("$language")
            fi
          done

          if [ "${#languages[@]}" -eq 0 ]; then
            echo "::error title=Missing package languages::At least one package language is required."
            exit 1
          fi

          if [ -z "$store_listing_languages" ]; then
            echo "::error title=Missing Store listing languages::store_listing_languages is required to fetch the draft listing metadata."
            exit 1
          fi

          for listing_language in ${store_listing_languages//,/ }; do
            if ! [[ "$listing_language" =~ ^[a-z]{2,3}(-[a-z0-9]{2,8})*$ ]]; then
              echo "::error title=Invalid Store listing language::listing language '$listing_language' is not a valid BCP-47-ish language tag."
              exit 1
            fi
          done

          languages_json="$(printf '%s\n' "${languages[@]}" | jq -R . | jq -sc .)"
          product_update="$(jq -nc \
            --arg x64_package_url "$x64_package_url" \
            --arg arm64_package_url "$arm64_package_url" \
            --argjson languages "$languages_json" \
            '{
              packages: [
                {
                  packageUrl: $x64_package_url,
                  languages: $languages,
                  architectures: ["X64"],
                  installerParameters: "/quiet /norestart",
                  isSilentInstall: true
                },
                {
                  packageUrl: $arm64_package_url,
                  languages: $languages,
                  architectures: ["Arm64"],
                  installerParameters: "/quiet /norestart",
                  isSilentInstall: true
                }
              ]
            }'
          )"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_base_url=$package_base_url" >> "$GITHUB_OUTPUT"
          echo "product_id=$product_id" >> "$GITHUB_OUTPUT"
          echo "x64_installer_name=$x64_installer_name" >> "$GITHUB_OUTPUT"
          echo "arm64_installer_name=$arm64_installer_name" >> "$GITHUB_OUTPUT"
          echo "x64_package_url=$x64_package_url" >> "$GITHUB_OUTPUT"
          echo "arm64_package_url=$arm64_package_url" >> "$GITHUB_OUTPUT"
          echo "package_languages=$package_languages" >> "$GITHUB_OUTPUT"
          echo "store_listing_languages=$store_listing_languages" >> "$GITHUB_OUTPUT"
          echo "product_update=$product_update" >> "$GITHUB_OUTPUT"
          echo "release_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "store_preflight=$store_preflight" >> "$GITHUB_OUTPUT"

      - name: Validate live Microsoft Store credentials
        if: ${{ steps.norm.outputs.dry_run != 'true' }}
        env:
          MICROSOFT_STORE_TENANT_ID: ${{ secrets.MICROSOFT_STORE_TENANT_ID }}
          MICROSOFT_STORE_CLIENT_ID: ${{ secrets.MICROSOFT_STORE_CLIENT_ID }}
          MICROSOFT_STORE_CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
          MICROSOFT_STORE_SELLER_ID: ${{ secrets.MICROSOFT_STORE_SELLER_ID }}
        run: |
          set -euo pipefail

          required=(
            MICROSOFT_STORE_TENANT_ID
            MICROSOFT_STORE_CLIENT_ID
            MICROSOFT_STORE_CLIENT_SECRET
            MICROSOFT_STORE_SELLER_ID
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error title=Missing Microsoft Store credentials::Set %s for live Microsoft Store submission.\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Load GitHub release notes
        run: |
          set -euo pipefail

          mkdir -p dist
          release_notes="$(gh release view "${{ steps.norm.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
          release_notes="$(printf '%s' "$release_notes" | tr -d '\r')"

          if [ -z "$release_notes" ]; then
            release_notes="GitComet v${{ steps.norm.outputs.version }}"
          fi

          printf '%s' "$release_notes" > dist/microsoft-store-release-notes.txt

      - name: Preview Store listing metadata
        if: ${{ steps.norm.outputs.dry_run == 'true' }}
        env:
          LISTING_LANGUAGES: ${{ steps.norm.outputs.store_listing_languages }}
          RELEASE_URL: ${{ steps.norm.outputs.release_url }}
        run: |
          set -euo pipefail

          # A dry run cannot read the real draft, so exercise the transform against a stub
          # listing. That still covers the sanitizing and 1500 character truncation of the
          # real release notes, which is where this step used to break on release day.
          jq -nc --arg language "${LISTING_LANGUAGES%%,*}" \
            '{Listings: [{Language: $language, Description: "dry-run stub", WhatsNew: "dry-run stub"}]}' \
            > dist/microsoft-store-listings.json

          scripts/microsoft-store-listing-metadata.sh \
            --listings-json dist/microsoft-store-listings.json \
            --release-notes dist/microsoft-store-release-notes.txt \
            --release-url "$RELEASE_URL" \
            --output-dir dist/microsoft-store-metadata \
            > dist/microsoft-store-metadata-payloads.txt

          payload_file="$(head -n 1 dist/microsoft-store-metadata-payloads.txt)"

          {
            echo "### Microsoft Store \"What's new\" preview"
            echo
            echo '```'
            jq -r '.Listings.WhatsNew' "$payload_file"
            echo '```'
            echo
            echo "- Characters: \`$(jq -r '.Listings.WhatsNew | length' "$payload_file")\` of 1500"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for hosted MSI URLs to become reachable
        run: |
          set -euo pipefail

          package_urls=(
            "${{ steps.norm.outputs.x64_package_url }}"
            "${{ steps.norm.outputs.arm64_package_url }}"
          )

          for package_url in "${package_urls[@]}"; do
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --head "$package_url" >/dev/null; then
                break
              fi

              if [ "$attempt" -eq 12 ]; then
                echo "::error title=Hosted MSI unavailable::Package URL '${package_url}' was not reachable after repeated checks."
                exit 1
              fi

              sleep 10
            done

            # A successful HEAD can still point at an HTML error document. Read the
            # first eight bytes and require the OLE Compound File signature used by MSI.
            signature_file="${RUNNER_TEMP}/$(basename "$package_url").signature"
            curl --fail --silent --show-error --location --range 0-7 \
              --output "$signature_file" "$package_url"
            signature="$(od -An -tx1 -N8 "$signature_file" | tr -d ' \n')"
            if [ "$signature" != "d0cf11e0a1b11ae1" ]; then
              echo "::error title=Hosted package is not an MSI::Package URL '${package_url}' does not begin with the MSI/OLE file signature."
              exit 1
            fi
          done

      - name: Install .NET 9 for Microsoft Store CLI
        if: ${{ steps.norm.outputs.dry_run != 'true' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Verify Microsoft Store CLI runtime
        if: ${{ steps.norm.outputs.dry_run != 'true' }}
        run: |
          set -euo pipefail

          dotnet --list-runtimes
          if ! dotnet --list-runtimes | grep -Eq '^Microsoft\.NETCore\.App 9\.'; then
            echo "::error title=Missing .NET 9 runtime::Microsoft Store CLI v0.3.9 requires Microsoft.NETCore.App 9.x."
            exit 1
          fi

      - name: Install Microsoft Store CLI Linux dependencies
        if: ${{ steps.norm.outputs.dry_run != 'true' }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-0

      - name: Start Microsoft Store CLI secret service
        if: ${{ steps.norm.outputs.dry_run != 'true' }}
        run: |
          set -euo pipefail

          runtime_dir="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"

          eval "$(dbus-launch --sh-syntax)"

          keyring_password="gitcomet-ci-keyring"
          keyring_env="$(printf '%s' "$keyring_password" | gnome-keyring-daemon --unlock)"
          if [ -n "$keyring_env" ]; then
            eval "$keyring_env"
          fi

          keyring_env="$(gnome-keyring-daemon --start --components=secrets)"
          if [ -n "$keyring_env" ]; then
            eval "$keyring_env"
          fi

          {
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
            echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID"
            if [ -n "${GNOME_KEYRING_CONTROL:-}" ]; then
              echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL"
            fi
          } >> "$GITHUB_ENV"

      - name: Install Microsoft Store CLI
        if: ${{ steps.norm.outputs.dry_run != 'true' }}
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.3.9

      - name: Report Microsoft Store CLI version
        if: ${{ steps.norm.outputs.dry_run != 'true' }}
        id: store_cli
        run: |
          set -euo pipefail

          cli_version="$(msstore --version 2>&1 | tail -n 1)"
          echo "Microsoft Store CLI: $cli_version"
          echo "version=$cli_version" >> "$GITHUB_OUTPUT"

      - name: Configure Microsoft Store CLI
        if: ${{ steps.norm.outputs.dry_run != 'true' }}
        env:
          MICROSOFT_STORE_TENANT_ID: ${{ secrets.MICROSOFT_STORE_TENANT_ID }}
          MICROSOFT_STORE_CLIENT_ID: ${{ secrets.MICROSOFT_STORE_CLIENT_ID }}
          MICROSOFT_STORE_CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
          MICROSOFT_STORE_SELLER_ID: ${{ secrets.MICROSOFT_STORE_SELLER_ID }}
        run: |
          set -euo pipefail

          msstore reconfigure \
            --tenantId "$MICROSOFT_STORE_TENANT_ID" \
            --sellerId "$MICROSOFT_STORE_SELLER_ID" \
            --clientId "$MICROSOFT_STORE_CLIENT_ID" \
            --clientSecret "$MICROSOFT_STORE_CLIENT_SECRET"

      - name: Prepare Microsoft Store listing metadata
        if: ${{ steps.norm.outputs.dry_run != 'true' }}
        id: metadata_prepare
        continue-on-error: ${{ steps.norm.outputs.store_preflight != 'true' }}
        env:
          PRODUCT_ID: ${{ steps.norm.outputs.product_id }}
          LISTING_LANGUAGES: ${{ steps.norm.outputs.store_listing_languages }}
          RELEASE_URL: ${{ steps.norm.outputs.release_url }}
          STORE_PREFLIGHT: ${{ steps.norm.outputs.store_preflight }}
        run: |
          set -euo pipefail

          prepare_dir="dist/microsoft-store-preflight"
          prepare_summary="$prepare_dir/summary.json"
          mkdir -p "$prepare_dir"
          prepare_failed=false
          if ! scripts/microsoft-store-prepare-metadata.sh \
            --product-id "$PRODUCT_ID" \
            --languages "$LISTING_LANGUAGES" \
            --release-notes dist/microsoft-store-release-notes.txt \
            --release-url "$RELEASE_URL" \
            --output-dir "$prepare_dir" \
            > "$prepare_summary"; then
            prepare_failed=true
          fi

          if ! jq -e . "$prepare_summary" >/dev/null 2>&1; then
            echo "::warning title=Invalid Store preflight summary::The read-only listing preflight did not produce valid summary JSON. Package publishing may continue without a listing metadata update."
            prepare_failed=true
            prepare_status="unavailable"
            payload_count=0
            matched_languages=""
          else
            prepare_status="$(jq -r '.status // "unavailable"' "$prepare_summary")"
            payload_count="$(jq -r '.payloadFiles | length' "$prepare_summary")"
            matched_languages="$(jq -r '.matchedLanguages | join(",")' "$prepare_summary")"
          fi

          if [ "$prepare_failed" = "true" ]; then
            echo "::warning title=Store listing metadata preparation incomplete::The requested listing metadata ('$LISTING_LANGUAGES') could not be prepared completely. Package publishing may continue with any valid payloads."
          fi

          {
            echo "status=$prepare_status"
            echo "payload_count=$payload_count"
            echo "matched_languages=$matched_languages"
          } >> "$GITHUB_OUTPUT"

          if [ "$prepare_failed" = "true" ] && [ "$STORE_PREFLIGHT" = "true" ]; then
            echo "::error title=Microsoft Store preflight failed::Live listing access and payload generation must succeed in store_preflight mode."
            exit 1
          fi

      - name: Update Microsoft Store draft submission packages
        if: ${{ steps.norm.outputs.dry_run != 'true' && steps.norm.outputs.store_preflight != 'true' }}
        env:
          PRODUCT_ID: ${{ steps.norm.outputs.product_id }}
          PRODUCT_UPDATE: ${{ steps.norm.outputs.product_update }}
        run: |
          set -euo pipefail

          msstore submission update "$PRODUCT_ID" "$PRODUCT_UPDATE" --verbose

      - name: Update Microsoft Store draft submission metadata
        if: ${{ steps.norm.outputs.dry_run != 'true' && steps.norm.outputs.store_preflight != 'true' && steps.metadata_prepare.outputs.payload_count != '' && steps.metadata_prepare.outputs.payload_count != '0' }}
        id: metadata_update
        continue-on-error: true
        env:
          PRODUCT_ID: ${{ steps.norm.outputs.product_id }}
        run: |
          set -euo pipefail

          mapfile -t payload_files < dist/microsoft-store-preflight/payloads.txt
          updated_languages=()
          failed_languages=()

          for payload_file in "${payload_files[@]}"; do
            [ -n "$payload_file" ] || continue
            language="$(jq -r '.Listings | .Language // .language // "unknown"' "$payload_file")"
            echo "Updating '$language' listing metadata from ${payload_file}"
            if msstore submission updateMetadata "$PRODUCT_ID" "$(cat "$payload_file")" --verbose; then
              updated_languages+=("$language")
            else
              failed_languages+=("$language")
              echo "::warning title=Store listing metadata update failed::The '$language' listing was not updated. Package publishing will continue."
            fi
          done

          updated_csv="$(IFS=,; echo "${updated_languages[*]}")"
          failed_csv="$(IFS=,; echo "${failed_languages[*]}")"
          if [ "${#failed_languages[@]}" -eq 0 ]; then
            update_status="updated"
          elif [ "${#updated_languages[@]}" -eq 0 ]; then
            update_status="failed"
          else
            update_status="partial"
          fi

          {
            echo "status=$update_status"
            echo "updated_languages=$updated_csv"
            echo "failed_languages=$failed_csv"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Microsoft Store submission
        if: ${{ steps.norm.outputs.dry_run != 'true' && steps.norm.outputs.store_preflight != 'true' }}
        id: publish
        env:
          PRODUCT_ID: ${{ steps.norm.outputs.product_id }}
        run: |
          set -euo pipefail

          # `publish` reports the submission id on its status line, which msstore writes to
          # stderr with ANSI markup, so capture both streams and strip the escape codes.
          msstore submission publish "$PRODUCT_ID" 2>&1 | tee dist/microsoft-store-publish.log

          submission_id="$(
            sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' dist/microsoft-store-publish.log \
              | grep -oiE 'published with id[[:space:]]+[A-Za-z0-9._-]+' \
              | tail -n 1 \
              | awk '{print $NF}' \
              || true
          )"
          echo "submission_id=${submission_id}" >> "$GITHUB_OUTPUT"

      - name: Emit deployment summary
        if: ${{ always() }}
        env:
          PRODUCT_ID: ${{ steps.norm.outputs.product_id }}
          SUBMISSION_ID: ${{ steps.publish.outputs.submission_id }}
          DRY_RUN: ${{ steps.norm.outputs.dry_run }}
          STORE_PREFLIGHT: ${{ steps.norm.outputs.store_preflight }}
          STORE_CLI_VERSION: ${{ steps.store_cli.outputs.version }}
          METADATA_PREPARE_OUTCOME: ${{ steps.metadata_prepare.outcome }}
          METADATA_PREPARE_STATUS: ${{ steps.metadata_prepare.outputs.status }}
          MATCHED_LISTING_LANGUAGES: ${{ steps.metadata_prepare.outputs.matched_languages }}
          METADATA_UPDATE_OUTCOME: ${{ steps.metadata_update.outcome }}
          METADATA_UPDATE_STATUS: ${{ steps.metadata_update.outputs.status }}
          UPDATED_LISTING_LANGUAGES: ${{ steps.metadata_update.outputs.updated_languages }}
          FAILED_LISTING_LANGUAGES: ${{ steps.metadata_update.outputs.failed_languages }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" = "true" ]; then
            mode="Validated Microsoft Store submission payload without submitting"
            product_id_display="${PRODUCT_ID:-n/a (dry run without product id)}"
          elif [ "$STORE_PREFLIGHT" = "true" ] && [ "$METADATA_PREPARE_OUTCOME" = "success" ]; then
            mode="Validated live Microsoft Store listing access without mutating the submission"
            product_id_display="$PRODUCT_ID"
          elif [ "$STORE_PREFLIGHT" = "true" ]; then
            mode="Live Microsoft Store preflight failed without mutating the submission"
            product_id_display="$PRODUCT_ID"
          elif [ "$PUBLISH_OUTCOME" = "success" ]; then
            mode="Submitted Microsoft Store update"
            product_id_display="$PRODUCT_ID"
          else
            mode="Microsoft Store submission did not complete"
            product_id_display="$PRODUCT_ID"
          fi

          {
            echo "### ${mode}"
            echo
            echo "- Release tag: \`${{ steps.norm.outputs.tag }}\`"
            echo "- Version: \`${{ steps.norm.outputs.version }}\`"
            echo "- Microsoft Store product id: \`${product_id_display}\`"
            echo "- Hosted x64 MSI URL: \`${{ steps.norm.outputs.x64_package_url }}\`"
            echo "- Hosted ARM64 MSI URL: \`${{ steps.norm.outputs.arm64_package_url }}\`"
            echo "- Package languages: \`${{ steps.norm.outputs.package_languages }}\`"
            echo "- Requested Store listing languages: \`${{ steps.norm.outputs.store_listing_languages }}\`"
            if [ -n "${STORE_CLI_VERSION:-}" ]; then
              echo "- Microsoft Store CLI: \`${STORE_CLI_VERSION}\`"
            fi
            if [ "$DRY_RUN" != "true" ]; then
              echo "- Listing preparation: \`${METADATA_PREPARE_STATUS:-unknown}\` (step outcome: \`${METADATA_PREPARE_OUTCOME:-unknown}\`)"
              echo "- Matched Store listing languages: \`${MATCHED_LISTING_LANGUAGES:-none}\`"
              if [ "$STORE_PREFLIGHT" != "true" ]; then
                echo "- Listing update: \`${METADATA_UPDATE_STATUS:-not attempted}\` (step outcome: \`${METADATA_UPDATE_OUTCOME:-skipped}\`)"
                echo "- Updated Store listing languages: \`${UPDATED_LISTING_LANGUAGES:-none}\`"
                echo "- Failed Store listing languages: \`${FAILED_LISTING_LANGUAGES:-none}\`"
                echo "- Publish step outcome: \`${PUBLISH_OUTCOME:-skipped}\`"
              fi
            fi
            echo "- Changelog source: \`GitHub release body for ${{ steps.norm.outputs.tag }}\` (Store listing \`WhatsNew\`)"
            if [ -n "${SUBMISSION_ID:-}" ]; then
              echo "- Store submission id: \`${SUBMISSION_ID}\`"
            fi
            echo "- Installer names:"
            echo "  - \`${{ steps.norm.outputs.x64_installer_name }}\`"
            echo "  - \`${{ steps.norm.outputs.arm64_installer_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
