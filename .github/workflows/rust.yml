name: Rust

on:
  workflow_call:
    inputs:
      cold-cache:
        type: boolean
        default: false
      test-schedule:
        description: Test scheduling candidate (keep serial until measured)
        type: string
        default: serial
      fixture-timings:
        description: Collect per-test fixture and subprocess timings
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Bypass dependency caches
        type: boolean
        default: false
      test-schedule:
        description: Test scheduling candidate (keep serial until measured)
        type: choice
        options: [serial, balanced]
        default: serial
      fixture-timings:
        description: Collect per-test fixture and subprocess timings
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI_TEST_SCHEDULE: ${{ inputs.test-schedule || 'serial' }}
  GITCOMET_CI_FIXTURE_TIMINGS: ${{ inputs.fixture-timings && format('{0}/target/ci-reports/fixture-timings', github.workspace) || '' }}

jobs:
  fmt:
    name: Rustfmt and CI configuration
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Install Python for CI helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.7"
      - name: Check CI helpers
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Lint workflows
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash -o "$RUNNER_TEMP/actionlint-installer.bash"
          bash "$RUNNER_TEMP/actionlint-installer.bash" 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color -shellcheck=""

  audit:
    name: Dependency audit (cargo-audit)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Restore cargo-audit binary
        if: inputs.cold-cache != true
        id: audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: gitcomet-ci-audit-ubuntu22-x64-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Run cargo-audit
        run: cargo audit
      - name: Check audit cache budget
        shell: bash
        run: python3 -c 'import pathlib; assert (pathlib.Path.home()/".cargo/bin/cargo-audit").stat().st_size <= 64*1024**2, "cargo-audit exceeds its cache allocation"'
      - name: Save cargo-audit binary
        if: success() && inputs.cold-cache != true && steps.audit-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: gitcomet-ci-audit-ubuntu22-x64-${{ env.CARGO_AUDIT_VERSION }}

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          context: ubuntu22-x64-clippy
          cold-cache: ${{ inputs.cold-cache }}
          nextest: "false"
          compiled: "false"
      - name: Clippy (libraries)
        run: cargo clippy --locked -p gitcomet-core -p gitcomet-state -p gitcomet-git-gix -p gitcomet-tree-sitter-alloc -- -D warnings
      - name: Clippy (headless app)
        run: cargo clippy --locked -p gitcomet --no-default-features --features gix -- -D warnings
      - uses: ./.github/actions/ci-finish
        if: always()
        with:
          name: clippy
          cache-key: ${{ steps.setup.outputs.cache-key }}
          cache-hit: ${{ steps.setup.outputs.cache-hit }}
          cold-cache: ${{ inputs.cold-cache }}
          compiled: "false"

  headless:
    name: Headless builds and package test suites
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require Git LFS
        run: git lfs version
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          context: ubuntu22-x64-headless-ci-test
          cold-cache: ${{ inputs.cold-cache }}
      - name: Build libraries and headless app
        run: |
          python3 scripts/ci/run.py command --name headless-build-libraries -- cargo build --locked --profile ci-test -p gitcomet-core -p gitcomet-state -p gitcomet-git-gix
          python3 scripts/ci/run.py command --name headless-build-app -- cargo build --locked --profile ci-test -p gitcomet --no-default-features --features gix
      - name: Compile package test contexts
        run: |
          for context in core state backend app; do
            python3 scripts/ci/run.py compile --context "$context"
          done
      - name: Run every package context and doctests
        run: |
          result=0
          for context in core state backend app; do
            python3 scripts/ci/run.py test --context "$context" --schedule "$CI_TEST_SCHEDULE" || result=1
            python3 scripts/ci/run.py doc --context "$context" || result=1
          done
          exit "$result"
      - uses: ./.github/actions/ci-finish
        if: always()
        with:
          name: headless
          cache-key: ${{ steps.setup.outputs.cache-key }}
          cache-hit: ${{ steps.setup.outputs.cache-hit }}
          cold-cache: ${{ inputs.cold-cache }}
          budget-mib: "400"
