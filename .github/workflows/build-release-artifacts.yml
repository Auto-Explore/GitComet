name: Build Release Artifacts

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      deb_revision:
        required: false
        type: string
        default: "1"
      release_id:
        required: false
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: false
      AZURE_STORAGE_ACCOUNT_KEY:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_SIGNING_CERT_BASE64:
        required: false
      MACOS_SIGNING_CERT_PASSWORD:
        required: false
      MACOS_NOTARY_KEY_ID:
        required: false
      MACOS_NOTARY_ISSUER_ID:
        required: false
      MACOS_NOTARY_API_KEY_P8:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build from (e.g. v0.2.0)"
        required: true
        type: string
      version:
        description: "Optional version override (e.g. 0.2.0). If omitted, derived from tag."
        required: false
        type: string
      deb_revision:
        description: "Debian package revision suffix appended to the upstream version (e.g. 1 for 1.2.3-1)."
        required: true
        default: "1"
        type: string
      release_id:
        description: "Optional release id for manual backfills"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: build-release-artifacts-${{ inputs.tag || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WIXTOOLSET_VERSION: 3.14.1.20250415
  CARGO_WIX_VERSION: 0.3.9
  APPIMAGETOOL_VERSION: 1.9.1
  DUMP_SYMS_VERSION: 2.3.9

jobs:
  prepare:
    name: Normalize release metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.norm.outputs.tag }}
      version: ${{ steps.norm.outputs.version }}
      deb_revision: ${{ steps.norm.outputs.deb_revision }}
      release_id: ${{ steps.norm.outputs.release_id }}
    steps:
      - name: Normalize tag and version
        id: norm
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          INPUT_DEB_REVISION: ${{ inputs.deb_revision }}
          DISPATCH_DEB_REVISION: ${{ github.event.inputs.deb_revision }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          DISPATCH_RELEASE_ID: ${{ github.event.inputs.release_id }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-${DISPATCH_TAG:-}}"
          version="${INPUT_VERSION:-${DISPATCH_VERSION:-}}"
          deb_revision="${INPUT_DEB_REVISION:-${DISPATCH_DEB_REVISION:-1}}"
          release_id="${INPUT_RELEASE_ID:-${DISPATCH_RELEASE_ID:-}}"

          tag="$(echo "$tag" | tr -d '[:space:]')"
          version="$(echo "$version" | tr -d '[:space:]')"
          deb_revision="$(echo "$deb_revision" | tr -d '[:space:]')"
          release_id="$(echo "$release_id" | tr -d '[:space:]')"

          if [ -z "$tag" ]; then
            echo "::error title=Missing tag::Tag is required."
            exit 1
          fi

          if [[ "$tag" != v* ]]; then
            tag="v${tag}"
          fi

          if [ -z "$version" ]; then
            version="${tag#v}"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error title=Invalid version::Expected semver like 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi

          if [ "$tag" != "v${version}" ]; then
            echo "::error title=Tag/version mismatch::Tag '$tag' does not match version '$version'."
            exit 1
          fi

          if ! [[ "$deb_revision" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid Debian revision::Expected a positive integer like 1, 2, or 3."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deb_revision=$deb_revision" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build_windows:
    name: Build Windows artifacts (${{ matrix.target_platform }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # No aarch64-pc-windows-msvc dump_syms build is published, so both
          # legs use the x64 asset; the ARM runner executes it under emulation.
          - target_platform: x86_64-windows
            artifact_arch: x86_64
            runs_on: windows-latest
            dump_syms_sha256: bdf48486220708808a3e00aec78856ee1cce096189d47a1e2cb1c635f93bacc7
          - target_platform: aarch64-windows
            artifact_arch: arm64
            runs_on: windows-11-arm
            dump_syms_sha256: bdf48486220708808a3e00aec78856ee1cce096189d47a1e2cb1c635f93bacc7
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ACCOUNT_NAME: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
      WINDOWS_SIGNING_PROFILE_NAME: ${{ needs.prepare.outputs.release_id != '' && 'gitcomet-windows-release' || 'gitcomet-windows-test' }}
      WINDOWS_SIGNING_TIMESTAMP_RFC3161: http://timestamp.acs.microsoft.com/
      DUMP_SYMS_SHA256: ${{ matrix.dump_syms_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate Windows signing configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "AZURE_CREDENTIALS",
            "WINDOWS_SIGNING_ENDPOINT",
            "WINDOWS_SIGNING_ACCOUNT_NAME"
          )
          $missing = @()

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required Windows signing secret(s)/variable(s): $($missing -join ', ')"
          }

          Write-Host "Using Windows signing profile: $env:WINDOWS_SIGNING_PROFILE_NAME"

      - name: Log into Azure for Windows signing
        uses: azure/login@v3
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Locate SignTool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          # Prefer arch-matched signtool (arm64 on ARM runners, x64 on x64 runners), fall back to any.
          $hostArch = if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'x64' }
          $signTool = Get-ChildItem -Path $kitsRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\$hostArch\\" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if ([string]::IsNullOrWhiteSpace($signTool)) {
            $signTool = Get-ChildItem -Path $kitsRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if ([string]::IsNullOrWhiteSpace($signTool)) {
            throw "Unable to locate signtool.exe on the GitHub Actions runner."
          }

          "SIGNTOOL_PATH=$signTool" >> $env:GITHUB_ENV

      # No aarch64-pc-windows-msvc build is published; the ARM runner executes
      # the x64 binary under emulation. dump_syms parses the .pdb as a file
      # format, so the host architecture does not have to match the target.
      - name: Install dump_syms
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $asset = "dump_syms-x86_64-pc-windows-msvc.zip"
          $expected = "${env:DUMP_SYMS_SHA256}"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $binDir = Join-Path $env:RUNNER_TEMP "dump-syms-bin"

          $url = "https://github.com/mozilla/dump_syms/releases/download/v${env:DUMP_SYMS_VERSION}/$asset"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $archive

          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch for $asset`n  expected: $expected`n  actual:   $actual"
          }

          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          Expand-Archive -Path $archive -DestinationPath $binDir -Force
          $exe = Get-ChildItem -Path $binDir -Recurse -Filter dump_syms.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($exe)) {
            throw "Extracted archive did not contain dump_syms.exe."
          }

          & $exe --version
          Split-Path $exe -Parent >> $env:GITHUB_PATH

      - name: Build release binary
        shell: pwsh
        env:
          # MSVC keeps debug info in the .pdb, and this is what makes the linker
          # emit one: `strip` is ignored entirely on MSVC (rustc's MsvcLinker
          # passes /DEBUG unconditionally), so it is not the knob here.
          # Step-scoped so `cargo install cargo-wix` below does not rebuild its
          # dependency tree with debug info nobody will read.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: |
          cargo build -p gitcomet --release --locked --features ui-gpui,gix --bin gitcomet

      # Runs under bash so all three platforms share one guard against
      # silently-empty symbols; Git for Windows provides it on the runner.
      - name: Emit Breakpad symbols
        shell: bash
        run: |
          scripts/emit-breakpad-symbols.sh \
            --input target/release/gitcomet.pdb \
            --store dist/symbols

      # Release-only: `publish_symbols` is the sole consumer and needs a
      # release_id too. Symbols are still generated above, which is what
      # exercises the pipeline.
      - name: Upload Windows Breakpad symbols
        if: ${{ needs.prepare.outputs.release_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.target_platform }}
          path: dist/symbols
          if-no-files-found: error
          retention-days: 7

      # Uploaded before packaging so a later failure in this job still leaves
      # symbols for the binary that was built.
      - name: Upload Windows debug symbols
        if: ${{ needs.prepare.outputs.release_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          # Deliberately not named `windows-release-artifacts-*`:
          # `publish_release_assets` globs that prefix into the published
          # release, and these symbols are for triaging crash dumps rather than
          # for users. The `gitcomet.pdb` file name is kept so a debugger can
          # resolve it from the binary's debug directory.
          name: windows-debug-symbols-${{ matrix.target_platform }}
          path: target/release/gitcomet.pdb
          if-no-files-found: error
          retention-days: 90

      - name: Sign Windows release binary
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.WINDOWS_SIGNING_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: gitcomet.exe
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.WINDOWS_SIGNING_TIMESTAMP_RFC3161 }}
          timestamp-digest: SHA256
          append-signature: false
          cache-dependencies: false

      - name: Verify signed Windows release binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactPath = Join-Path $env:GITHUB_WORKSPACE "target\release\gitcomet.exe"
          & "$env:GITHUB_WORKSPACE\scripts\windows\verify-signed-artifact.ps1" `
            -Path $artifactPath `
            -SignToolPath $env:SIGNTOOL_PATH

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path dist\portable -Force | Out-Null
          Copy-Item target\release\gitcomet.exe dist\portable\gitcomet.exe -Force
          Copy-Item README.md dist\portable\README.md -Force
          Copy-Item LICENSE-AGPL-3.0 dist\portable\LICENSE-AGPL-3.0 -Force
          Copy-Item NOTICE dist\portable\NOTICE -Force

          $zipName = "gitcomet-v${env:VERSION}-windows-${env:ARTIFACT_ARCH}-portable.zip"
          if (Test-Path "dist\$zipName") { Remove-Item "dist\$zipName" -Force }
          Compress-Archive -Path dist\portable\* -DestinationPath "dist\$zipName"

      - name: Build MSI installer (WiX)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install wixtoolset --version "${env:WIXTOOLSET_VERSION}" --yes --no-progress
          cargo install cargo-wix --version "${env:CARGO_WIX_VERSION}" --locked

          # Chocolatey updates machine-level env vars, but the current pwsh session does not pick them up automatically.
          $wixRoot = [Environment]::GetEnvironmentVariable("WIX", "Machine")
          if ([string]::IsNullOrWhiteSpace($wixRoot)) {
            $candidateRoots = @()
            if (${env:ProgramFiles(x86)}) {
              $candidateRoots += (Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.14")
            }
            if ($env:ProgramFiles) {
              $candidateRoots += (Join-Path $env:ProgramFiles "WiX Toolset v3.14")
            }
            $wixRoot = $candidateRoots |
              Where-Object { Test-Path (Join-Path $_ "bin\candle.exe") } |
              Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($wixRoot)) {
            throw "Unable to locate the WiX Toolset installation after Chocolatey install."
          }
          $wixBin = $wixRoot
          if (!(Test-Path (Join-Path $wixBin "candle.exe"))) {
            $wixBin = Join-Path $wixRoot "bin"
          }
          if (!(Test-Path (Join-Path $wixBin "candle.exe"))) {
            throw "WiX Toolset bin directory '$wixBin' does not contain candle.exe."
          }
          $env:WIX = Split-Path $wixBin -Parent
          $env:PATH = "$wixBin;$env:PATH"

          if (!(Test-Path "crates\gitcomet\wix\main.wxs")) {
            cargo wix init --package gitcomet
          }
          $msiName = "gitcomet-v${env:VERSION}-windows-${env:ARTIFACT_ARCH}.msi"
          cargo wix --package gitcomet --profile release --nocapture --no-build --bin-path "$wixBin" --output "dist\$msiName"

      - name: Sign Windows MSI installer
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.WINDOWS_SIGNING_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: gitcomet-v${{ env.VERSION }}-windows-${{ env.ARTIFACT_ARCH }}.msi
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.WINDOWS_SIGNING_TIMESTAMP_RFC3161 }}
          timestamp-digest: SHA256
          append-signature: false
          cache-dependencies: false

      - name: Verify signed Windows MSI installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifactPath = Join-Path $env:GITHUB_WORKSPACE "dist\gitcomet-v$($env:VERSION)-windows-$($env:ARTIFACT_ARCH).msi"
          & "$env:GITHUB_WORKSPACE\scripts\windows\verify-signed-artifact.ps1" `
            -Path $artifactPath `
            -SignToolPath $env:SIGNTOOL_PATH

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-artifacts-${{ matrix.target_platform }}
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error
          retention-days: 7

  build_linux:
    name: Build Linux artifacts (${{ matrix.target_platform }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build Linux release artifacts on Ubuntu 22.04 so the linked
          # system libraries stay compatible with Ubuntu 22.04+.
          - target_platform: x86_64-linux
            artifact_arch: x86_64
            deb_arch: amd64
            runs_on: ubuntu-22.04
            build_appimage: true
            appimagetool_asset: appimagetool-x86_64.AppImage
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            appimage_arch: x86_64
            dump_syms_asset: dump_syms-x86_64-unknown-linux-gnu.tar.xz
            dump_syms_sha256: 0fc852a86b00337407d9d423cc388a24c3b489ccaaedcf92623cad57af5ca8ad
          - target_platform: aarch64-linux
            artifact_arch: arm64
            deb_arch: arm64
            runs_on: ubuntu-22.04-arm
            build_appimage: true
            appimagetool_asset: appimagetool-aarch64.AppImage
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            appimage_arch: aarch64
            dump_syms_asset: dump_syms-aarch64-unknown-linux-gnu.tar.xz
            dump_syms_sha256: 1b8d6ab436fbfeb9820d4a21413cc77c50c6a4221cff25a830f5d53ba0aaa732
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DEB_REVISION: ${{ needs.prepare.outputs.deb_revision }}
      ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
      DEB_ARCH: ${{ matrix.deb_arch }}
      APPIMAGETOOL_ASSET: ${{ matrix.appimagetool_asset }}
      APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
      APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
      DUMP_SYMS_ASSET: ${{ matrix.dump_syms_asset }}
      DUMP_SYMS_SHA256: ${{ matrix.dump_syms_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Linux UI native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            dpkg-dev \
            pkg-config \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dump_syms
        run: |
          set -euo pipefail
          bin_dir="$(scripts/install-dump-syms.sh \
            --version "${DUMP_SYMS_VERSION}" \
            --asset "${DUMP_SYMS_ASSET}" \
            --sha256 "${DUMP_SYMS_SHA256}")"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Build release binary
        env:
          # Build with the DWARF intact so symbols can be extracted, then strip
          # back down to the manifest's `debuginfo` level before packaging.
          # Step-scoped so no other cargo invocation in this job inherits it.
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build -p gitcomet --release --locked --features ui-gpui,gix --bin gitcomet

      - name: Emit Breakpad symbols
        run: |
          set -euo pipefail
          scripts/emit-breakpad-symbols.sh \
            --input target/release/gitcomet \
            --store dist/symbols

      # Release-only; see the Breakpad symbol upload above.
      - name: Upload Linux Breakpad symbols
        if: ${{ needs.prepare.outputs.release_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.target_platform }}
          path: dist/symbols
          if-no-files-found: error
          retention-days: 7

      # Every packaging step below installs from target/release/gitcomet, so
      # stripping once here covers the tar.gz, .deb and AppImage alike. The raw
      # DWARF is deliberately not archived: it is ~203 MiB per build and the
      # .sym above already covers minidump-stackwalk.
      - name: Strip release binary
        run: |
          set -euo pipefail
          strip --strip-debug target/release/gitcomet
          ls -l target/release/gitcomet

      - name: Normalize desktop entry metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          # Backward compatibility for older tags that used non-standard categories.
          sed 's/VersionControl;/RevisionControl;/g' assets/linux/gitcomet.desktop > dist/gitcomet.desktop
          desktop-file-validate dist/gitcomet.desktop

      - name: Package tar.gz
        run: |
          set -euo pipefail
          root="gitcomet-v${VERSION}-linux-${ARTIFACT_ARCH}"
          mkdir -p "dist/stage/${root}"
          install -m755 target/release/gitcomet "dist/stage/${root}/gitcomet"
          install -m644 README.md "dist/stage/${root}/README.md"
          install -m644 LICENSE-AGPL-3.0 "dist/stage/${root}/LICENSE-AGPL-3.0"
          install -m644 NOTICE "dist/stage/${root}/NOTICE"
          tar -C dist/stage -czf "dist/${root}.tar.gz" "${root}"

      - name: Package .deb
        run: |
          set -euo pipefail
          deb_upstream_version="${VERSION/-rc./~rc.}"
          deb_revision="${DEB_REVISION}"
          deb_version="${deb_upstream_version}-${deb_revision}"
          if [[ -e debian ]]; then
            echo "::error title=Unexpected debian directory::The release workflow expects no repository debian/ directory."
            exit 1
          fi

          trap 'rm -rf debian' EXIT
          pkg_root="debian/gitcomet"
          mkdir -p "${pkg_root}/DEBIAN"
          mkdir -p "${pkg_root}/usr/bin"
          mkdir -p "${pkg_root}/usr/share/applications"
          mkdir -p "${pkg_root}/usr/share/icons/hicolor/512x512/apps"

          install -m755 target/release/gitcomet "${pkg_root}/usr/bin/gitcomet"
          install -m644 dist/gitcomet.desktop "${pkg_root}/usr/share/applications/gitcomet.desktop"
          install -m644 assets/gitcomet-512.png "${pkg_root}/usr/share/icons/hicolor/512x512/apps/gitcomet.png"

          {
            echo "Source: gitcomet"
            echo "Maintainer: AutoExplore Oy <info@autoexplore.ai>"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Standards-Version: 4.7.0"
            echo
            echo "Package: gitcomet"
            echo "Architecture: ${DEB_ARCH}"
            echo "Depends: git, \${shlibs:Depends}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Description: Fast, resource-efficient Git GUI written in Rust."
          } > debian/control

          {
            echo "gitcomet (${deb_version}) unstable; urgency=medium"
            echo
            echo "  * Release ${VERSION}."
            echo
            echo " -- AutoExplore Oy <info@autoexplore.ai>  $(date -Ru)"
          } > debian/changelog

          dpkg-shlibdeps -Tdebian/substvars "${pkg_root}/usr/bin/gitcomet"
          dpkg-gencontrol -pgitcomet -P"${pkg_root}" -Tdebian/substvars

          pkg_file="dist/gitcomet_${deb_version}_${DEB_ARCH}.deb"
          dpkg-deb --build "${pkg_root}" "${pkg_file}"

          package_name="$(dpkg-deb -f "${pkg_file}" Package)"
          package_version="$(dpkg-deb -f "${pkg_file}" Version)"
          package_architecture="$(dpkg-deb -f "${pkg_file}" Architecture)"
          package_depends="$(dpkg-deb -f "${pkg_file}" Depends)"

          if [[ "${package_name}" != "gitcomet" ]]; then
            echo "::error title=Unexpected package name::Got ${package_name}."
            exit 1
          fi
          if [[ "${package_version}" != "${deb_version}" ]]; then
            echo "::error title=Unexpected package version::Got ${package_version}, expected ${deb_version}."
            exit 1
          fi
          if [[ "${package_architecture}" != "${DEB_ARCH}" ]]; then
            echo "::error title=Unexpected package architecture::Got ${package_architecture}, expected ${DEB_ARCH}."
            exit 1
          fi
          if ! grep -Eq '(^|, )git($|, )' <<<"${package_depends}"; then
            echo "::error title=Missing git dependency::Got ${package_depends}."
            exit 1
          fi
          if [[ "${package_depends}" == "git" ]]; then
            echo "::error title=Missing shared library dependencies::Got ${package_depends}."
            exit 1
          fi

      - name: Package AppImage
        if: ${{ matrix.build_appimage }}
        run: |
          set -euo pipefail
          appdir="dist/AppDir"
          mkdir -p "${appdir}/usr/bin"
          install -m755 target/release/gitcomet "${appdir}/usr/bin/gitcomet"
          install -m644 dist/gitcomet.desktop "${appdir}/gitcomet.desktop"
          install -m644 assets/gitcomet-512.png "${appdir}/gitcomet.png"

          {
            echo '#!/usr/bin/env bash'
            echo 'set -euo pipefail'
            echo 'HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"'
            echo 'exec "${HERE}/usr/bin/gitcomet" "$@"'
          } > "${appdir}/AppRun"
          chmod +x "${appdir}/AppRun"

          curl -fsSL \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/${APPIMAGETOOL_ASSET}" \
            -o /tmp/appimagetool.AppImage
          echo "${APPIMAGETOOL_SHA256}  /tmp/appimagetool.AppImage" | sha256sum -c -
          chmod +x /tmp/appimagetool.AppImage
          ARCH="${APPIMAGE_ARCH}" /tmp/appimagetool.AppImage --appimage-extract-and-run \
            "${appdir}" "dist/gitcomet-v${VERSION}-linux-${ARTIFACT_ARCH}.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-artifacts-${{ matrix.target_platform }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  build_macos:
    name: Build macOS artifacts (${{ matrix.target_platform }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_platform: aarch64-darwin
            arch: arm64
            runs_on: macos-latest
            dump_syms_asset: dump_syms-aarch64-apple-darwin.tar.xz
            dump_syms_sha256: 4945b7e5de0d7ad403822635f0fb912b69990fc412741ff2b7b512e168c40a32
          - target_platform: x86_64-darwin
            arch: x86_64
            runs_on: macos-15-intel
            dump_syms_asset: dump_syms-x86_64-apple-darwin.tar.xz
            dump_syms_sha256: e255caf99e403b31613c756babcead8463f6e600c1a9e1e5531fbe27a7e29cf2
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
      DUMP_SYMS_ASSET: ${{ matrix.dump_syms_asset }}
      DUMP_SYMS_SHA256: ${{ matrix.dump_syms_sha256 }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_SIGNING_CERT_BASE64: ${{ secrets.MACOS_SIGNING_CERT_BASE64 }}
      MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_API_KEY_P8: ${{ secrets.MACOS_NOTARY_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install dump_syms
        run: |
          set -euo pipefail
          bin_dir="$(scripts/install-dump-syms.sh \
            --version "${DUMP_SYMS_VERSION}" \
            --asset "${DUMP_SYMS_ASSET}" \
            --sha256 "${DUMP_SYMS_SHA256}")"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Determine macOS signing mode
        id: macos_signing_mode
        run: |
          set -euo pipefail

          required=(
            MACOS_SIGNING_IDENTITY
            MACOS_SIGNING_CERT_BASE64
            MACOS_SIGNING_CERT_PASSWORD
            MACOS_NOTARY_KEY_ID
            MACOS_NOTARY_ISSUER_ID
            MACOS_NOTARY_API_KEY_P8
          )
          present=()
          missing=()

          for name in "${required[@]}"; do
            if [ -n "${!name:-}" ]; then
              present+=("$name")
            else
              missing+=("$name")
            fi
          done

          if [ "${#present[@]}" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing is not configured; building unsigned macOS artifacts."
            exit 0
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Incomplete macOS signing configuration::Missing required secret(s): ${missing[*]}"
            echo "::error title=Partial macOS signing configuration::Either provide all macOS signing and notarization secrets or leave them all unset to build unsigned artifacts."
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Prepare macOS signing and notarization credentials
        if: ${{ steps.macos_signing_mode.outputs.enabled == 'true' }}
        id: macos_signing
        run: |
          set -euo pipefail

          keychain_path="${RUNNER_TEMP}/gitcomet-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert_path="${RUNNER_TEMP}/gitcomet-signing-cert.p12"
          api_key_path="${RUNNER_TEMP}/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
          default_keychain="$(security default-keychain -d user | tr -d '"' | xargs)"

          if base64 --help 2>&1 | grep -q -- '--decode'; then
            printf '%s' "$MACOS_SIGNING_CERT_BASE64" | base64 --decode > "$cert_path"
          else
            printf '%s' "$MACOS_SIGNING_CERT_BASE64" | base64 -D > "$cert_path"
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -k "$keychain_path" \
            -P "$MACOS_SIGNING_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          security find-identity -v -p codesigning "$keychain_path"

          printf '%s' "$MACOS_NOTARY_API_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"

          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"
          echo "default_keychain=$default_keychain" >> "$GITHUB_OUTPUT"

      - name: Show macOS disk usage before packaging
        run: |
          set -euo pipefail
          df -h || true
          for path in target "$HOME/.cargo/registry" "$HOME/.cargo/git" dist "$RUNNER_TEMP"; do
            if [ -e "$path" ]; then
              du -sh "$path" || true
            else
              echo "missing: $path"
            fi
          done

      - name: Package macOS release assets
        env:
          GITCOMET_MACOS_PACKAGE_CLEAN_TARGET: "1"
          # This step runs the build via package-macos.sh. Mach-O keeps debug
          # info outside the binary, so dsymutil must run to produce the .dSYM;
          # the manifest's `strip = "debuginfo"` needs no override because
          # stripping the binary does not touch the bundle.
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: |
          set -euo pipefail
          package_args=(
            --version "${VERSION}"
            --arch "${ARCH}"
            --release
            --out-dir dist
            --symbols-out dist/symbols
          )

          if [ "${{ steps.macos_signing_mode.outputs.enabled }}" = "true" ]; then
            package_args+=(
              --codesign-identity "${MACOS_SIGNING_IDENTITY}"
              --codesign-keychain "${{ steps.macos_signing.outputs.keychain_path }}"
            )
          else
            echo "Building unsigned macOS artifacts because signing is not configured."
          fi

          scripts/package-macos.sh "${package_args[@]}"

      # Release-only; see the Breakpad symbol upload above.
      - name: Upload macOS Breakpad symbols
        if: ${{ needs.prepare.outputs.release_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.target_platform }}
          path: dist/symbols
          if-no-files-found: error
          retention-days: 7

      # Kept for lldb, which cannot read Breakpad .sym.
      #
      # Archived first because upload-artifact roots the artifact at the least
      # common ancestor of the matched files: pointing it at the bundle
      # directory would produce a download containing a bare `Contents/` tree,
      # with the `.dSYM` wrapper lost and the bundle no longer loadable. Staged
      # outside dist/ so it stays out of the artifacts published to the release.
      - name: Archive macOS dSYM
        if: ${{ needs.prepare.outputs.release_id != '' }}
        env:
          DSYM_DIR: ${{ runner.temp }}/gitcomet-dsym
        run: |
          set -euo pipefail
          dsym="target/release/gitcomet.dSYM"

          # package-macos.sh replaces Cargo's symlink with a real directory; if
          # that regresses, `tar` would store a dangling link and still exit 0,
          # sailing past `if-no-files-found` with an empty bundle.
          if [ -L "$dsym" ] || [ ! -d "$dsym" ]; then
            echo "::error title=No dSYM to archive::${dsym} is not a directory; the bundle Cargo symlinked to was probably cleaned away."
            exit 1
          fi
          if [ -z "$(find "${dsym}/Contents/Resources/DWARF" -type f -print -quit 2>/dev/null)" ]; then
            echo "::error title=Empty dSYM::${dsym} carries no DWARF payload."
            exit 1
          fi

          mkdir -p "$DSYM_DIR"
          tar -czhf "${DSYM_DIR}/gitcomet-${ARCH}.dSYM.tar.gz" \
            -C target/release gitcomet.dSYM

      - name: Upload macOS dSYM
        if: ${{ needs.prepare.outputs.release_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-dsym-${{ matrix.target_platform }}
          path: ${{ runner.temp }}/gitcomet-dsym/gitcomet-${{ matrix.arch }}.dSYM.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Notarize and verify macOS artifacts
        if: ${{ steps.macos_signing_mode.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          scripts/notarize-macos.sh \
            --version "${VERSION}" \
            --arch "${ARCH}" \
            --out-dir dist \
            --api-key "${{ steps.macos_signing.outputs.api_key_path }}" \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER_ID}"

      - name: Cleanup macOS signing keychain
        if: ${{ always() && steps.macos_signing_mode.outputs.enabled == 'true' }}
        env:
          KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.keychain_path }}
          DEFAULT_KEYCHAIN_PATH: ${{ steps.macos_signing.outputs.default_keychain }}
          API_KEY_PATH: ${{ steps.macos_signing.outputs.api_key_path }}
        run: |
          set -euo pipefail
          if [ -n "${DEFAULT_KEYCHAIN_PATH:-}" ]; then
            security default-keychain -d user -s "$DEFAULT_KEYCHAIN_PATH" || true
          fi
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${API_KEY_PATH:-}" ] && [ -f "$API_KEY_PATH" ]; then
            rm -f "$API_KEY_PATH"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-artifacts-${{ matrix.target_platform }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish_symbols:
    name: Publish Breakpad symbols
    runs-on: ubuntu-22.04
    # Six ~239 MiB symbol files are downloaded, merged and re-uploaded here.
    timeout-minutes: 60
    # `publish_release_assets` depends on every build matrix and only succeeds
    # after the complete payload has been attached to the draft release. Keep
    # production symbols behind that same all-or-nothing release boundary: a
    # failed target cancels the release, so none of that build's symbols belong
    # in the store either.
    needs: [prepare, publish_release_assets]
    #
    # `release_id` is empty for test builds, which must not push ~1.4 GiB into
    # the production store for a release that may never exist — the same
    # distinction the Windows signing profile makes.
    if: ${{ needs.prepare.outputs.release_id != '' && needs.publish_release_assets.result == 'success' }}
    # Symbols are auxiliary triage data. This job lives inside a reusable
    # workflow whose overall result gates publish_release and every deploy job
    # in release-manual-main.yml, so a transient Azure error must not strand a
    # fully-built release as a draft. The job still shows red.
    continue-on-error: true
    env:
      AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
      # Symbols sit alongside the APT repo and the Windows installer in the same
      # static-website container, so they are served from
      # https://apt.gitcomet.dev/symbols/ with no extra infrastructure.
      SYMBOLS_STORAGE_ACCOUNT: ${{ vars.SYMBOLS_STORAGE_ACCOUNT || vars.APT_STORAGE_ACCOUNT }}
      SYMBOLS_CONTAINER: ${{ vars.APT_STORAGE_CONTAINER }}
      SYMBOLS_PREFIX: symbols
    steps:
      # The job's `if` already established this is a real tagged release, so
      # missing credentials are a misconfiguration, not a fork. Failing loudly
      # matches deploy-apt-repo.yml and deploy-windows-installer.yml; silently
      # skipping would ship releases whose crashes cannot be symbolized and
      # nobody would notice until the first report arrives.
      - name: Check symbol store configuration
        run: |
          set -euo pipefail
          if [ -z "${SYMBOLS_STORAGE_ACCOUNT:-}" ]; then
            echo "::error title=Missing storage account::Set the APT_STORAGE_ACCOUNT (or SYMBOLS_STORAGE_ACCOUNT) repository variable."
            exit 1
          fi
          if [ -z "${SYMBOLS_CONTAINER:-}" ]; then
            echo "::error title=Missing storage container::Set the APT_STORAGE_CONTAINER repository variable."
            exit 1
          fi
          if [ -z "${AZURE_STORAGE_ACCOUNT_KEY:-}" ]; then
            echo "::error title=Missing storage credentials::Set the AZURE_STORAGE_ACCOUNT_KEY secret to publish symbols."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: symbols-*
          path: dist/symbols
          merge-multiple: true

      - name: Summarize symbol store
        run: |
          set -euo pipefail
          if [ -z "$(find dist/symbols -type f -name '*.sym' -print -quit 2>/dev/null)" ]; then
            echo "::error title=No symbols::No .sym files were produced by any build job."
            exit 1
          fi
          find dist/symbols -type f -name '*.sym' -exec du -h {} +

      # Paths are keyed by debug ID, so a given path always describes the same
      # build. Overwriting is therefore a no-op in content and keeps re-runs of
      # this job green.
      - name: Upload symbols to the store
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/azure-config
        run: |
          set -euo pipefail
          mkdir -p "$AZURE_CONFIG_DIR"

          az storage blob upload-batch \
            --account-name "${SYMBOLS_STORAGE_ACCOUNT}" \
            --account-key "${AZURE_STORAGE_ACCOUNT_KEY}" \
            --destination "${SYMBOLS_CONTAINER}" \
            --destination-path "${SYMBOLS_PREFIX}" \
            --source dist/symbols \
            --overwrite true \
            --no-progress \
            --output none

          # Report where the symbols actually went rather than a hardcoded
          # public URL, which would be wrong the moment the account changes.
          echo "Symbols published to ${SYMBOLS_STORAGE_ACCOUNT}/${SYMBOLS_CONTAINER}/${SYMBOLS_PREFIX}/"

  publish_release_assets:
    name: Attach assets and checksums to GitHub release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [prepare, build_windows, build_linux, build_macos]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      ENABLE_KEYLESS_SIGNING: ${{ vars.ENABLE_KEYLESS_SIGNING }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: windows-release-artifacts-*
          path: dist/windows
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-release-artifacts-*
          path: dist/linux
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: macos-release-artifacts-*
          path: dist/macos
          merge-multiple: true

      - name: Assemble release payload
        run: |
          set -euo pipefail
          mkdir -p dist/release
          find dist/windows -maxdepth 1 -type f -exec cp -f {} dist/release/ \;
          find dist/linux -maxdepth 1 -type f -exec cp -f {} dist/release/ \;
          find dist/macos -maxdepth 1 -type f -exec cp -f {} dist/release/ \;
          file_count="$(find dist/release -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [ "${file_count}" = "0" ]; then
            echo "::error title=No release artifacts::No files were assembled into dist/release."
            exit 1
          fi
          ls -lah dist/release

      - name: Generate Homebrew cask
        run: |
          set -euo pipefail
          linux_arm_appimage="gitcomet-v${VERSION}-linux-arm64.AppImage"
          linux_intel_appimage="gitcomet-v${VERSION}-linux-x86_64.AppImage"
          arm_dmg="gitcomet-v${VERSION}-macos-arm64.dmg"
          intel_dmg="gitcomet-v${VERSION}-macos-x86_64.dmg"
          linux_arm_appimage_path="dist/release/${linux_arm_appimage}"
          linux_intel_appimage_path="dist/release/${linux_intel_appimage}"
          arm_dmg_path="dist/release/${arm_dmg}"
          intel_dmg_path="dist/release/${intel_dmg}"

          if [ ! -f "${linux_arm_appimage_path}" ] || [ ! -f "${linux_intel_appimage_path}" ] || [ ! -f "${arm_dmg_path}" ] || [ ! -f "${intel_dmg_path}" ]; then
            echo "::error title=Missing release assets::Expected ${linux_arm_appimage}, ${linux_intel_appimage}, ${arm_dmg}, and ${intel_dmg} in dist/release."
            exit 1
          fi

          scripts/generate-homebrew-cask.sh \
            --version "${VERSION}" \
            --github-repo "${GITHUB_REPOSITORY}" \
            --arm-dmg "${arm_dmg_path}" \
            --intel-dmg "${intel_dmg_path}" \
            --linux-arm-appimage "${linux_arm_appimage_path}" \
            --linux-intel-appimage "${linux_intel_appimage_path}" \
            --output "dist/release/gitcomet.rb"

      - name: Generate checksums
        run: |
          set -euo pipefail
          pushd dist/release >/dev/null
          md5_file="gitcomet-v${VERSION}-checksums.md5"
          sha_file="gitcomet-v${VERSION}-checksums.sha256"

          find . -maxdepth 1 -type f \
            ! -name "*checksums*" \
            -printf "%P\n" \
            | LC_ALL=C sort > /tmp/release_files.txt

          xargs -I{} md5sum "{}" < /tmp/release_files.txt > "$md5_file"
          xargs -I{} sha256sum "{}" < /tmp/release_files.txt > "$sha_file"
          popd >/dev/null

      - name: Install cosign
        if: ${{ env.ENABLE_KEYLESS_SIGNING == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256 checksums with keyless signing
        if: ${{ env.ENABLE_KEYLESS_SIGNING == 'true' }}
        run: |
          set -euo pipefail
          sha_file="dist/release/gitcomet-v${VERSION}-checksums.sha256"
          sig_file="dist/release/gitcomet-v${VERSION}-checksums.sha256.sig"
          cert_file="dist/release/gitcomet-v${VERSION}-checksums.sha256.pem"
          cosign sign-blob --yes \
            --output-signature "$sig_file" \
            --output-certificate "$cert_file" \
            "$sha_file"

      - name: Upload payload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-payload
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload assets to GitHub release
        if: ${{ env.RELEASE_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" dist/release/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Emit release summary
        run: |
          set -euo pipefail
          uploaded="no"
          if [ -n "${RELEASE_ID}" ]; then
            uploaded="yes"
          fi
          {
            echo "### Built release artifacts"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Version: \`$VERSION\`"
            echo "- Release upload attempted: \`${uploaded}\`"
            echo ""
            echo "Files:"
            ls -1 dist/release | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
