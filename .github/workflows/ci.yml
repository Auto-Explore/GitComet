name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Bypass dependency caches to measure cold compilation
        type: boolean
        default: false
      test-schedule:
        description: Test scheduling candidate (keep serial until measured)
        type: choice
        options: [serial, balanced]
        default: serial
      fixture-timings:
        description: Collect per-test fixture and subprocess timings
        type: boolean
        default: false
      execution-samples:
        description: Uninstrumented workspace repetitions (1 is normal CI)
        type: number
        default: 1
      nextest-threads:
        description: Workspace nextest concurrency
        type: string
        default: ''
      nextest-profile:
        description: Workspace nextest concurrency policy
        type: choice
        options: [ci, ci-git-limited, ci-watch-limited-4, ci-watch-limited-8, ci-watch-first, ci-throughput]
        default: ci
      pure-threads:
        description: Optional positive concurrency for audited pure batches
        type: string
        default: ''
      resource-stats:
        description: Collect instrumented process-tree diagnostics
        type: boolean
        default: false
      batch-pure-tests:
        description: Audited batching mode (auto enables on Windows)
        type: string
        default: auto
      ui-threads:
        description: Workspace UI libtest concurrency
        type: string
        default: ''
      benchmark-profile:
        description: Compile/link profile (candidate disables UI optimization)
        type: choice
        options: [ci-bench, ci-bench-candidate]
        default: ci-bench

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: ./.github/workflows/rust.yml
    with:
      cold-cache: ${{ inputs.cold-cache || false }}
      test-schedule: ${{ inputs.test-schedule || 'serial' }}
      fixture-timings: ${{ inputs.fixture-timings || false }}
  platforms:
    uses: ./.github/workflows/cross-platform-tests.yml
    with:
      cold-cache: ${{ inputs.cold-cache || false }}
      test-schedule: ${{ inputs.test-schedule || 'serial' }}
      fixture-timings: ${{ inputs.fixture-timings || false }}
      execution-samples: ${{ inputs.execution-samples || 1 }}
      nextest-threads: ${{ inputs.nextest-threads || '' }}
      nextest-profile: ${{ inputs.nextest-profile || 'ci' }}
      pure-threads: ${{ inputs.pure-threads || '' }}
      resource-stats: ${{ inputs.resource-stats || false }}
      batch-pure-tests: ${{ inputs.batch-pure-tests || 'auto' }}
      ui-threads: ${{ inputs.ui-threads || '' }}
  benchmarks:
    uses: ./.github/workflows/benchmark-targets.yml
    with:
      cold-cache: ${{ inputs.cold-cache || false }}
      benchmark-profile: ${{ inputs.benchmark-profile || 'ci-bench' }}
  complete:
    name: CI complete
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    if: always()
    needs: [rust, platforms, benchmarks]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify every validation lane completed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results = json.loads(os.environ["CI_RESULTS"]); assert set(results) == {"rust", "platforms", "benchmarks"}; failed = {k:v["result"] for k,v in results.items() if v["result"] != "success"}; assert not failed, failed'
      - name: Retire obsolete validation caches
        if: always() && inputs.cold-cache != true && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/report.py caches --prune
