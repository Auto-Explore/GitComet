name: Benchmark Targets

on:
  workflow_call:
    inputs:
      cold-cache:
        type: boolean
        default: false
      benchmark-profile:
        description: Compile/link profile (candidate disables UI optimization)
        type: string
        default: ci-bench
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Bypass dependency caches
        type: boolean
        default: false
      benchmark-profile:
        description: Compile/link profile (candidate disables UI optimization)
        type: choice
        options: [ci-bench, ci-bench-candidate]
        default: ci-bench

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI_BENCHMARK_PROFILE: ${{ inputs.benchmark-profile || 'ci-bench' }}

jobs:
  compile:
    name: Benchmark Target Compile (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu22-x64
            runner: ubuntu-22.04
          - name: macos-latest-arm64
            runner: macos-latest
          - name: windows-x64
            runner: windows-latest
          - name: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux UI link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          pkg-config --modversion xcb xkbcommon xkbcommon-x11
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          context: ${{ matrix.name }}-benchmarks-${{ env.CI_BENCHMARK_PROFILE }}
          cold-cache: ${{ inputs.cold-cache }}
          nextest: "false"
          compiled: "false"
      - name: Compile and link Criterion and support targets
        shell: bash
        run: |
          python3 scripts/ci/run.py command --name compile-benchmark-targets -- cargo build --locked --profile "$CI_BENCHMARK_PROFILE" --timings -p gitcomet-ui-gpui --features benchmarks --bench performance --bin perf_budget_report --bin perf_idle_resource
          python3 scripts/ci/run.py command --name compile-app-launch-harness -- cargo build --locked --profile "$CI_BENCHMARK_PROFILE" --timings -p gitcomet --bin perf-app-launch
      - uses: ./.github/actions/ci-finish
        if: always()
        with:
          name: benchmark-${{ matrix.name }}
          cache-key: ${{ steps.setup.outputs.cache-key }}
          cache-hit: ${{ steps.setup.outputs.cache-hit }}
          cold-cache: ${{ inputs.cold-cache }}
          compiled: "false"
