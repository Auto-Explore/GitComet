name: CI reports and cache
description: Publish timing/coverage artifacts and save bounded dependencies from completed default-branch builds
inputs:
  name:
    description: Unique artifact name
    required: true
  source-writer:
    description: Designated native writer for this OS family
    default: "false"
# Cache state comes from the job environment ci-setup exported (CI_CACHE_*, CI_SOURCE_*, CI_COLD_CACHE).
# Status functions here only see this action's own steps. Packing needs the whole job to have
# succeeded (a skipped compile would leave units out), so those steps read job.status.
runs:
  using: composite
  steps:
    - name: Pack compiled dependency cache
      id: compiled
      if: ${{ !cancelled() && job.status == 'success' && env.CI_COLD_CACHE != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && env.CI_CACHE_COMPILED == 'true' && env.CI_CACHE_HIT != 'true' }}
      shell: bash
      run: python3 scripts/ci/cache.py pack-compiled --context "$CI_CACHE_CONTEXT" --bundle "$RUNNER_TEMP/gitcomet-ci-compiled.tar.gz"
    - name: Save compiled dependency cache
      if: ${{ !cancelled() && steps.compiled.outcome == 'success' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/gitcomet-ci-compiled.tar.gz
        key: ${{ env.CI_CACHE_KEY }}
    - name: Pack shared source cache
      id: sources
      if: ${{ !cancelled() && job.status == 'success' && env.CI_COLD_CACHE != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.source-writer == 'true' && env.CI_SOURCE_HIT != 'true' && env.CI_SOURCE_KEY != '' }}
      shell: bash
      run: python3 scripts/ci/cache.py pack-sources --bundle "$RUNNER_TEMP/gitcomet-ci-sources.tar.gz"
    - name: Save shared source cache
      if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/gitcomet-ci-sources.tar.gz
        key: ${{ env.CI_SOURCE_KEY }}
    - name: Publish CI diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-${{ inputs.name }}
        path: |
          target/ci-reports/
          target/cargo-timings/
          target/nextest/ci/
          target/nextest/ci-watch-stress/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
