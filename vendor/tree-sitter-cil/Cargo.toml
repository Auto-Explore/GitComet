# Written for GitComet, not vendored: there is no tree-sitter grammar for
# .NET's intermediate language anywhere at all.
# See grammar.js for what it does and does not model.
#
# `src/` is generated by tree-sitter-cli 0.26.13 from `grammar.js`, so
# regenerating is `tree-sitter generate` in this directory. The intent is to
# publish this to crates.io once it has had some mileage here.
#
# Compatibility with the workspace tree-sitter (see `tree-sitter` in the root
# Cargo.toml) is a hard requirement, enforced by the
# `vendored_grammars_are_abi_compatible_with_workspace_tree_sitter` test in
# crates/gitcomet-ui-gpui/src/view/rows/diff_text/syntax.rs.
[package]
name = "tree-sitter-cil"
description = "CIL (MSIL) grammar for the tree-sitter parsing library"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
# The build script body, shared by every vendored grammar.
tree-sitter-build = { path = "../tree-sitter-build" }

[dev-dependencies]
tree-sitter = "0.26.12"
