# Vendored from Havunen/gpui-ce 0665fb07d59cf7af185e58f44b9f890590abe204
# with lazy smoothing pipeline creation from 9362a02d98324c6d91a1bec58b90ab22ab667252.
# Workspace inheritance is expanded here; GPUI siblings retain the pinned base.
# See UPSTREAM.md for provenance, validation, and the upgrade procedure.
[package]
name = "gpui_ce_wgpu"
version = "0.1.0"
description = "A community fork of Zed's GPU-accelerated UI framework"
edition = "2024"
publish = true
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lib]
path = "src/gpui_wgpu.rs"

[features]
default = []
test-support = ["gpui/test-support", "dep:image"]
custom-gpu = ["gpui/custom-gpu"]
wgpu-surfaces = ["gpui/wgpu-surfaces"]

[dependencies]
gpui = { git = "https://github.com/Havunen/gpui-ce.git", rev = "0665fb07d59cf7af185e58f44b9f890590abe204", version = "0.2.2", package = "gpui-ce", default-features = false }
gpui_render = { git = "https://github.com/Havunen/gpui-ce.git", rev = "0665fb07d59cf7af185e58f44b9f890590abe204", version = "0.1.0", package = "gpui_ce_render" }
anyhow = "1"
collections = { git = "https://github.com/Havunen/gpui-ce.git", rev = "0665fb07d59cf7af185e58f44b9f890590abe204", version = "0.2.2", package = "gpui_ce_collections" }
etagere = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "webp"], optional = true }
log = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12"
profiling = "1"
raw-window-handle = "0.6"
smallvec = { version = "1", features = ["union", "const_new"] }
gpui_util = { git = "https://github.com/Havunen/gpui-ce.git", rev = "0665fb07d59cf7af185e58f44b9f890590abe204", version = "0.2.6", package = "gpui_ce_util" }
wgpu = "=29.0.4"
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false, features = ["validation"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-video = { version = "0.6", features = ["metal"] }
metal = "0.33"
objc2 = "0.6"
objc2-metal = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.100"

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "=29.0.4", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
bytemuck = { version = "1", features = ["derive"] }
criterion = { version = "0.8", features = ["html_reports"] }
env_logger = "0.11"
gpui_platform = { git = "https://github.com/Havunen/gpui-ce.git", rev = "0665fb07d59cf7af185e58f44b9f890590abe204", version = "0.1.0", package = "gpui_ce_platform", features = ["wayland", "x11", "test-support"] }
naga = { version = "=29.0.4", features = ["wgsl-in"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-backend = { version = "0.3.17", features = [
  "client_system",
  "dlopen",
  "rwh_06",
] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }

[[example]]
name = "custom_gpu"
required-features = ["custom-gpu"]

[[bench]]
name = "renderer"
harness = false
required-features = ["test-support"]
