# Vendored from https://github.com/jbellerb/tree-sitter-dhall
# at rev 62013259b26ac210d5de1abf64cf1b047ef88000 (MIT, see LICENSE).
#
# Vendored because there is no crates.io release at all: nothing there provides a
# Dhall grammar, and this is the only maintained one on GitHub with a licence.
#
# `src/` is regenerated (tree-sitter-cli 0.26.13) from the `grammar.js` beside
# it; the `tree_sitter/` headers come from vendor/tree-sitter-headers -- see the
# README there.
#
# `queries/` is deliberately not vendored, matching vendor/tree-sitter-vue.
# GitComet keeps its own query in
# crates/gitcomet-ui-gpui/src/view/rows/diff_text/queries/.
[package]
name = "tree-sitter-dhall"
description = "Dhall grammar for the tree-sitter parsing library"
version = "0.1.0"
repository = "https://github.com/jbellerb/tree-sitter-dhall"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

[dev-dependencies]
tree-sitter = "0.26.13"
