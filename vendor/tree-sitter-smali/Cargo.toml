# Unresolvable dependency: the crates.io 1.0.0 release pins tree-sitter ~0.20.10. Taken
# from difftastic 0.71.0's vendored_parsers/tree-sitter-smali (tag tarball sha256
# d6afd26103c6492a91307dc6779c7dd0ca4d4c85499f81d7dc53fdfa5107331d), which is
# https://git.sr.ht/~yotam/tree-sitter-smali at
# 5ae51e15c4d1ac93cba6127caf3d1f0a072c140c. `src/` is that copy verbatim, including its
# own `tree_sitter/` headers: its ABI 14 parser uses `TSFieldMapSlice`, which
# vendor/tree-sitter-headers no longer defines. `queries/highlights.scm` is the copy
# difftastic ships, read by vendor/difftastic (`HIGHLIGHTS_QUERY`).
# `bindings/rust/lib.rs` follows the repo template, since upstream's binds `tree-sitter`
# directly.
[package]
name = "tree-sitter-smali"
description = "Smali grammar for the tree-sitter parsing library"
version = "1.0.0"
repository = "https://git.sr.ht/~yotam/tree-sitter-smali"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

[dev-dependencies]
tree-sitter = "0.27.0"
