# Vendored from https://github.com/tree-sitter/tree-sitter-ocaml at
# 3b2e14e0697d405c9aa0beddfa09b71f45abc504 (0.26.0, MIT -- see LICENSE).
#
# Updated in the 2026-10-08 upstream sweep: nested comments use an iterative
# scanner rather than recursive calls that can overflow the stack; OxCaml modes
# and the intervening grammar/fuzzer fixes are included. Unlike the previous
# sweep's candidate, this revision introduces no additional parse errors in the
# checked OCaml compiler/stdlib sources and project fixtures (481 .ml/.mli files).
#
# Upstream removed the implementation-only shebang node from its highlights
# query, so that query now compiles against both .ml and .mli. GitComet uses
# HIGHLIGHTS_QUERY directly; its old duplicate query is no longer needed.
#
# Generated with tree-sitter-cli 0.27.0, ABI 15, TS_SMALL_STATE_THRESHOLD=128.
# STATE_COUNT/SYMBOL_COUNT match upstream for all three parsers: 13556/537
# (ocaml), 12097/536 (interface), 11973/536 (type). grammar.json and node-types.json
# are byte-identical. Only LARGE_STATE_COUNT changes: 3273 -> 132, 2690 -> 102,
# 2587 -> 100. Regenerate each grammar from its src/grammar.json using the patched
# CLI in vendor/README.md. Shared headers come from vendor/tree-sitter-headers.
#
# queries/ is vendored because GitComet uses the upstream query constants.
[package]
name = "tree-sitter-ocaml"
description = "OCaml grammar for tree-sitter"
version = "0.26.0"
repository = "https://github.com/tree-sitter/tree-sitter-ocaml"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

# Upstream's dev-dependency, kept so `bindings/rust/lib.rs`'s own test module still
# builds. This crate is workspace-`exclude`d, so it only runs under
# `cargo test --manifest-path vendor/tree-sitter-ocaml/Cargo.toml`. The version
# tracks `tree-sitter` in the root Cargo.toml.
[dev-dependencies]
tree-sitter = "0.27.0"
