# Vendored from https://github.com/alex-pinkus/tree-sitter-swift at 00bbb0a
# (MIT -- see LICENSE), to regenerate `src/parser.c` with a larger small-state
# threshold.
#
# Past the 0.7.3 release for 6ab8d1d, which fixes undefined behaviour that only
# bites on Windows: `OP_SYMBOL_SUPPRESSOR[BANG] = 1UL << FAKE_TRY_BANG` shifts by
# 32, and `unsigned long` is 32 bits under LLP64. Whether that lands on bit 32
# (correct), 0, or bit 31 is up to the compiler's constant folding -- at 0,
# `try! foo()` silently parses as `try (!foo)()`. Seven parse fixes ride along:
# prefix operators binding to navigation targets (`-v.x` was `(-v).x`),
# `if let x = try await f() {}` reading its block as a trailing closure, `#if` as
# a first member, `as? T ?? x`, `where` on switch-case patterns, continued
# bitwise expressions, and `@Test()`.
#
# `grammar.js` is vendored now (the crates.io release shipped only
# `src/grammar.json`) because upstream's default branch commits no `parser.c`.
#
# `queries/highlights.scm` moves with the grammar and must: e89a6d6 makes `nil` a
# named `nil_literal`, so 0.7.3's query fails to compile against this parser, and
# `language.rs` `.expect()`s that compile -- a mismatch panics the app rather
# than losing one colour.
#
# `tree-sitter generate` decides per parse state whether to emit a dense row in
# `ts_parse_table` (SYMBOL_COUNT * 2 bytes, O(1) lookup) or a compact entry in
# `ts_small_parse_table` (scanned), using
# `threshold = min(64, symbol_count / 2)`. That 64 is only the break-even for a
# grammar with <= 128 symbols; every large grammar has far more, so thousands of
# states get a dense row costing several times the compact form. Regenerating
# with `TS_SMALL_STATE_THRESHOLD=128` cuts the dense rows from 2128 to 805 here.
#
# It is a representation change only -- the automaton, and so every parse tree, is
# byte-identical. `vendor/README.md` has the procedure and the proof.
#
# Generated with tree-sitter-cli 0.26.13 at ABI 15, the ABI upstream ships,
# and the `tree_sitter/` headers come from vendor/tree-sitter-headers -- see the
# README there.
#
# `queries/` *is* vendored here, unlike most of vendor/: GitComet reads this
# grammar's upstream query consts rather than authoring its own, so dropping the
# directory would compile them out (`vendor/tree-sitter-build` sets the
# `with_*_query` cfgs from the files that are present) and the language would go
# uncoloured.
[package]
name = "tree-sitter-swift"
description = "swift grammar for the tree-sitter parsing library"
version = "0.7.3"
repository = "https://github.com/alex-pinkus/tree-sitter-swift"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

# Upstream's dev-dependency, kept so `bindings/rust/lib.rs`'s own test module still
# builds. This crate is workspace-`exclude`d, so it only runs under
# `cargo test --manifest-path vendor/tree-sitter-swift/Cargo.toml`. The version
# tracks `tree-sitter` in the root Cargo.toml.
[dev-dependencies]
tree-sitter = "0.27.0"
