# Vendored from https://github.com/alex-pinkus/tree-sitter-swift at
# 171fa3bc343233fe07f5e17205aaada33d778825 (0.7.4, MIT -- see LICENSE).
#
# Updated in the 2026-10-08 upstream sweep: Swift 6 sending/isolated parameters
# and returns, copy, value generics, inline arrays, argument-free macros,
# indented multiline regex closers, backDeployed attributes, and Swift 6.2
# strict-memory-safety `unsafe` expressions. The scanner handles allocation
# failure explicitly. Earlier Windows try! and prefix-navigation fixes remain.
# The highlights query moves with the grammar to colour unsafe expressions.
#
# Generated with tree-sitter-cli 0.27.0, ABI 15, TS_SMALL_STATE_THRESHOLD=128.
# Upstream commits no parser.c; this grammar generates STATE_COUNT 11522 /
# SYMBOL_COUNT 567 with LARGE_STATE_COUNT 858. The retune changes table storage
# only; grammar.json is identical to upstream. node-types.json is regenerated
# too: it differs from upstream's file only by omitting two anonymous entries
# (`?` and `??`). The corpus and highlight comparisons cover the actual parser.
# Regenerate from src/grammar.json using the patched CLI in vendor/README.md.
# Shared headers come from vendor/tree-sitter-headers.
#
# queries/ is vendored because GitComet uses the upstream query constants.
[package]
name = "tree-sitter-swift"
description = "swift grammar for the tree-sitter parsing library"
version = "0.7.4"
repository = "https://github.com/alex-pinkus/tree-sitter-swift"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

# Upstream's dev-dependency, kept so `bindings/rust/lib.rs`'s own test module still
# builds. This crate is workspace-`exclude`d, so it only runs under
# `cargo test --manifest-path vendor/tree-sitter-swift/Cargo.toml`. The version
# tracks `tree-sitter` in the root Cargo.toml.
[dev-dependencies]
tree-sitter = "0.27.0"
