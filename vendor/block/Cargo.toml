# Vendored from crates.io block 0.1.6 (SSheldon/rust-block, MIT).
# Keep the public block API and pointer ABI; use an inhabited repr(C) Class
# and ptr::addr_of! for its extern symbol to fix Rust's uninhabited_static lint.
# Spell the existing default C ABI explicitly to avoid missing_abi warnings.
[package]
name = "block"
version = "0.1.6"
edition = "2015"
authors = ["Steven Sheldon"]
description = "Rust interface for Apple's C language extension of blocks."
keywords = ["blocks", "osx", "ios", "objective-c"]
readme = "README.md"
repository = "http://github.com/SSheldon/rust-block"
documentation = "http://ssheldon.github.io/rust-objc/block/"
license = "MIT"

[dev-dependencies]
objc_test_utils = { version = "0.0.2", path = "test_utils" }
