# Vendored from https://github.com/tree-sitter/tree-sitter-php at
# 58d5643086ae60e93a3746cca648363ee97c8761 (0.25.1, MIT -- see LICENSE).
#
# Updated in the 2026-10-08 upstream sweep: reset the heredoc stack on
# deserialize, allow any non-name character after a heredoc/nowdoc closer,
# leading backslashes on grouped namespace uses, clone with arguments, and
# cast-type keywords such as OBJECT used as argument constants. The previous
# upstream fixes for popped heredoc storage and the shared array header remain.
#
# Generated with tree-sitter-cli 0.27.0, ABI 15, TS_SMALL_STATE_THRESHOLD=128.
# STATE_COUNT/SYMBOL_COUNT match upstream: 3469/433 (php), 3385/428 (php_only).
# grammar.json and node-types.json are byte-identical. Only LARGE_STATE_COUNT
# changes: 850 -> 214 and 839 -> 213. Regenerate each grammar from its
# src/grammar.json using the patched CLI in vendor/README.md.
# Shared headers come from vendor/tree-sitter-headers.
#
# queries/ is vendored because GitComet uses upstream's highlight query.
[package]
name = "tree-sitter-php"
description = "PHP grammar for tree-sitter"
version = "0.25.1"
repository = "https://github.com/tree-sitter/tree-sitter-php"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

# Upstream's dev-dependency, kept so `bindings/rust/lib.rs`'s own test module still
# builds. This crate is workspace-`exclude`d, so it only runs under
# `cargo test --manifest-path vendor/tree-sitter-php/Cargo.toml`. The version
# tracks `tree-sitter` in the root Cargo.toml.
[dev-dependencies]
tree-sitter = "0.27.0"
