# Vendored from https://github.com/ionide/tree-sitter-fsharp at
# aefd0c8741bdf3aeb827a228aa4a996a6536697e (MIT -- see LICENSE).
#
# Updated in the 2026-10-08 upstream sweep to 0.3.12: let-in after an if,
# match or lambda, multiline quotations, inline values, unnamed/by-ref extern
# parameters, generic properties, named delegate parameters and member operators.
# The previous static-member-val and constructor-as fixes remain included.
# Upstream highlights and locals queries move with the grammar.
#
# Generated with tree-sitter-cli 0.27.0, ABI 15, TS_SMALL_STATE_THRESHOLD=128.
# Both parsers reproduce upstream's automata exactly: STATE_COUNT/SYMBOL_COUNT
# 21942/539 (fsharp) and 15693/413 (signature). grammar.json and node-types.json
# are byte-identical; only LARGE_STATE_COUNT changes (8771 -> 2264 and 530 -> 2).
# Regenerate from each grammar's src/grammar.json with the patched CLI described
# in vendor/README.md. Shared headers come from vendor/tree-sitter-headers.
#
# Across the F# compiler/core corpus and fixtures, no previously clean source or
# signature file starts failing; three previously failing signatures become
# clean. Recovery changes in already failing signatures are recorded in the
# sweep report in vendor/README.md. GitComet uses the main grammar for .fsi too;
# signature-specific upstream queries are not the main grammar's queries.
#
# queries/ is vendored because GitComet uses the upstream query constants.
[package]
name = "tree-sitter-fsharp"
description = "fsharp grammar for the tree-sitter parsing library"
version = "0.3.12"
repository = "https://github.com/ionide/tree-sitter-fsharp"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

# Upstream's dev-dependency, kept so `bindings/rust/lib.rs`'s own test module still
# builds. This crate is workspace-`exclude`d, so it only runs under
# `cargo test --manifest-path vendor/tree-sitter-fsharp/Cargo.toml`. The version
# tracks `tree-sitter` in the root Cargo.toml.
[dev-dependencies]
tree-sitter = "0.27.0"
