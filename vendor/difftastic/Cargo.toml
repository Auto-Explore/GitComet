[package]
name = "difftastic"
description = "A structural diff that understands syntax."
repository = "https://github.com/wilfred/difftastic"
license = "MIT"
version = "0.71.0"
authors = ["Wilfred Hughes <me@wilfred.me.uk>"]
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"
# Upstream builds a binary, so its doc comments' code blocks were never doctests.
doctest = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
regex = { workspace = true }
typed-arena = "2.0.2"
rustc-hash = { workspace = true }
lazy_static = "1.5.1"
log = { workspace = true }
radix-heap = "0.4.2"
imara-diff = { version = "0.2.0", default-features = false }
bumpalo = "3.20.3"
glob = "0.3.4"
strum = { workspace = true }
hashbrown = "0.17.1"
humansize = "2.1.3"
line-numbers = "0.4.0"
smallvec = { workspace = true }
streaming-iterator = "0.1.9"

tree-sitter = { workspace = true }

tree-sitter-ada = { workspace = true }
tree-sitter-asm = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-clojure-orchard = { workspace = true }
