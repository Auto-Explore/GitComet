# Vendored from https://github.com/eonpatapon/tree-sitter-cue at dd7b90e
# (MIT -- see LICENSE, fetched from the repository because the published tarball
# ships none).
#
# It was the `tree-sitter-cue 0.0.1` crates.io release, which is a 2023 snapshot
# of an unmerged PR and three years behind. Everything below was silently wrong
# there -- no ERROR node, just the wrong tree: `-2.5` split into `number(-2)`
# and a stray `.5`, `b =~ "x"` became a field plus a unary, and `b[2]` became a
# field plus a list. `foo!:`, `try`/`?`, `else`, `~` aliases, `matchN` and
# `rune` are new syntax it never had. Failing files on the cue-lang corpus:
# 16 -> 2.
#
# The `optional`/`required` label wrapper means `queries/cue_highlights.scm`
# needs its own patterns for `foo?:`/`foo!:`, which is why the query moves with
# this grammar.
#
# Vendored rather than depended on, because the published crate has a normal
# dependency on `tree-sitter ~0.20`. `tree-sitter` declares `links`, so cargo
# will not resolve it alongside the workspace's 0.26 at any version -- the same
# blocker documented on `tree-sitter-clojure-orchard` in the root Cargo.toml.
# Vendoring drops the pin: the grammar is bound to whichever tree-sitter the
# workspace resolves through `tree-sitter-language`, which is what
# `bindings/rust/lib.rs` is rewritten to use.
#
# `src/` is generated by tree-sitter-cli 0.26.13 (ABI 15) from the `grammar.js`
# beside it, and matches upstream's own dd7b90e output: STATE_COUNT 749,
# SYMBOL_COUNT 190, identical node-types.json. The `tree_sitter/` headers come
# from vendor/tree-sitter-headers -- see the README there.
#
# `queries/` is deliberately not vendored, matching vendor/tree-sitter-vue.
# GitComet keeps its own query in
# crates/gitcomet-ui-gpui/src/view/rows/diff_text/queries/.
[package]
name = "tree-sitter-cue"
description = "CUE grammar for the tree-sitter parsing library"
version = "0.0.1"
repository = "https://github.com/eonpatapon/tree-sitter-cue"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

[dev-dependencies]
tree-sitter = "0.27.0"
