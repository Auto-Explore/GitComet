# Vendored from the `tree-sitter-csv 1.2.0` crates.io release
# (https://github.com/amaanq/tree-sitter-csv, MIT -- see LICENSE, fetched from the
# repository because the published tarball ships none).
#
# Vendored rather than depended on, because the published crate has a normal
# dependency on `tree-sitter ~0.20`. `tree-sitter` declares `links`, so cargo
# will not resolve it alongside the workspace's 0.26 at any version -- the same
# blocker documented on `tree-sitter-clojure-orchard` in the root Cargo.toml.
# Vendoring drops the pin: the grammar is bound to whichever tree-sitter the
# workspace resolves through `tree-sitter-language`, which is what
# `bindings/rust/lib.rs` is rewritten to use.
#
# Upstream is a three-grammar repository (csv, psv, tsv); only `csv/` is taken.
# `.tsv` still has no highlighting -- it needs the sibling grammar vendored too.
#
# `common/define-grammar.js` is upstream's master at f6bf6e3 (unreleased), for
# 4934ce2 "properly parse text starting with a number": 1.2.0's `text` could not
# hold a space, a single character, or a leading digit, so ordinary fields such
# as `New York` errored -- 43 ERROR nodes in the corpus sample, 0 now.
#
# `src/` is generated by tree-sitter-cli 0.26.13 (ABI 15) from the `grammar.js`
# beside it, and matches upstream's own f6bf6e3 output apart from the banner and
# metadata version. The `tree_sitter/` headers come from
# vendor/tree-sitter-headers -- see the README there.
#
# `queries/` is deliberately not vendored, matching vendor/tree-sitter-vue.
# GitComet keeps its own query in
# crates/gitcomet-ui-gpui/src/view/rows/diff_text/queries/.
[package]
name = "tree-sitter-csv"
description = "CSV grammar for the tree-sitter parsing library"
version = "1.2.0"
repository = "https://github.com/amaanq/tree-sitter-csv"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

[dev-dependencies]
tree-sitter = "0.27.0"
