# Vendored from https://github.com/tree-sitter/tree-sitter-haskell at
# 97288e585b0bd44199720280d067fa35bacd81ff (0.24.1, MIT).
#
# Updated in the 2026-10-08 upstream sweep: type_synomym is corrected to
# type_synonym, `cases` is highlighted, and declaration query patterns name
# concrete decl/function, decl/bind and decl/signature subtypes. The old patterns
# are invalid under tree-sitter 0.27 and fail to compile against this parser.
# GitComet's haskell_highlights.scm mirrors these changes and retains its scoped
# (type/variable) capture so expression variables do not get the type colour.
# grammar/ is vendored along with grammar.js so its modular source is complete.
#
# Generated with tree-sitter-cli 0.27.0, ABI 15, TS_SMALL_STATE_THRESHOLD=128.
# STATE_COUNT 12862 / SYMBOL_COUNT 537 and all other automaton counts match
# upstream. grammar.json and node-types.json are byte-identical. The retune
# reduces LARGE_STATE_COUNT from 2378 to 117 without changing parsing.
# Regenerate from src/grammar.json with the patched CLI in vendor/README.md.
# Shared headers come from vendor/tree-sitter-headers.
#
# queries/ is vendored for the upstream constants; GitComet's own highlight query
# adds the scoped type-variable fix described above.
[package]
name = "tree-sitter-haskell"
description = "Haskell grammar for tree-sitter"
version = "0.24.1"
repository = "https://github.com/tree-sitter/tree-sitter-haskell"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

# Upstream's dev-dependency, kept so `bindings/rust/lib.rs`'s own test module still
# builds. This crate is workspace-`exclude`d, so it only runs under
# `cargo test --manifest-path vendor/tree-sitter-haskell/Cargo.toml`. The version
# tracks `tree-sitter` in the root Cargo.toml.
[dev-dependencies]
tree-sitter = "0.27.0"
