# No crates.io release: crates.io's tree-sitter-latex is a different grammar, and this
# one's manifest pins tree-sitter 0.24.1. Taken from difftastic 0.71.0's
# vendored_parsers/tree-sitter-latex (tag tarball sha256
# d6afd26103c6492a91307dc6779c7dd0ca4d4c85499f81d7dc53fdfa5107331d), which is
# https://github.com/latex-lsp/tree-sitter-latex at
# 7b06f6ed394308e7407a1703d2724128c45fc9d7 with `src/parser.c` regenerated by
# difftastic. `src/` is that copy verbatim, including its own `tree_sitter/` headers:
# its ABI 14 parser uses `TSFieldMapSlice`, which vendor/tree-sitter-headers no longer
# defines. vendor/difftastic reads its own LaTeX query
# (vendored_parsers/highlights/latex.scm). `bindings/rust/lib.rs` follows the repo
# template, since upstream's binds `tree-sitter` directly.
[package]
name = "tree-sitter-latex"
description = "LaTeX grammar for the tree-sitter parsing library"
version = "0.4.0"
repository = "https://github.com/latex-lsp/tree-sitter-latex"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

[dev-dependencies]
tree-sitter = "0.27.0"
