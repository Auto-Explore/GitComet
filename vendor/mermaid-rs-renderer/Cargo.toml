[package]
edition = "2024"
name = "mermaid-rs-renderer"
version = "0.3.1"
build = false
exclude = [
    "node_modules/",
    "comparison/",
    "tmp/",
    "docs/benchmarks/",
    "docs/comparisons/",
    "docs/comparison_sources/",
    "docs/conformance-report/",
    "docs/diagrams/",
    "docs/examples/",
    "docs/layout-compare-report/",
    "docs/*.html",
    "docs/*.json",
    "docs/*.md",
    "scripts/",
    ".github/",
    "package.json",
    "package-lock.json",
    "Cargo.toml.orig",
    "*.orig",
    "*.bak",
    "*~",
    ".DS_Store",
    "*.png",
    "*.html",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast Mermaid diagram renderer in pure Rust - 23 diagram types, 100-1400x faster than mermaid-cli"
homepage = "https://github.com/1jehuang/mermaid-rs-renderer"
readme = "README.md"
keywords = [
    "mermaid",
    "diagram",
    "svg",
    "renderer",
    "cli",
]
categories = [
    "command-line-utilities",
    "visualization",
]
license = "MIT"
repository = "https://github.com/1jehuang/mermaid-rs-renderer"

[features]
cli = ["dep:clap"]
default = [
    "cli",
    "png",
]
png = [
    "dep:resvg",
    "dep:usvg",
]

[lib]
name = "mermaid_rs_renderer"
path = "src/lib.rs"

[[bin]]
name = "mmdr"
path = "src/main.rs"
required-features = ["cli"]

[dependencies.anyhow]
version = "1.0"

[dependencies.clap]
version = "4.6.1"
features = ["derive"]
