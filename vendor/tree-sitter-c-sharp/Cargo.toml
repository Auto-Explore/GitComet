# Vendored from https://github.com/tree-sitter/tree-sitter-c-sharp at 9150f7d
# (MIT -- see LICENSE), to regenerate `src/parser.c` with a larger small-state
# threshold.
#
# Past 0.23.5 for f1c7c1e, where `(x) && y` parsed as a cast of `&y` rather than
# a logical AND -- no ERROR, just the wrong tree -- and for C# 14 (f2dea45):
# extension blocks, `a?.b = c`, `operator +=`, `(ref x) =>` lambdas, partial
# constructors and events. `"extension"` is captured in
# queries/csharp_highlights.scm, which only compiles against this grammar.
#
# **Generated with tree-sitter-cli 0.26.5, not 0.26.13 like the rest of
# vendor/.** 0.26.13 builds a *different* automaton for this grammar -- 8500
# states where upstream ships 8495 -- and the parser vendored here before this
# update had that drift: it turned `case string when IsOid(x):` into two ERROR
# nodes, which upstream's own parser.c parses cleanly. 0.26.5 is what upstream's
# package.json pins (`^0.26.5`), and it reproduces their `parser.c` byte for
# byte, so the retune below is once again representation-only. Check
# STATE_COUNT 8495 / SYMBOL_COUNT 542 after any regeneration; `grammar.json` and
# `node-types.json` are byte-identical to upstream's.
#
# `tree-sitter generate` decides per parse state whether to emit a dense row in
# `ts_parse_table` (SYMBOL_COUNT * 2 bytes, O(1) lookup) or a compact entry in
# `ts_small_parse_table` (scanned), using
# `threshold = min(64, symbol_count / 2)`. That 64 is only the break-even for a
# grammar with <= 128 symbols; every large grammar has far more, so thousands of
# states get a dense row costing several times the compact form. Regenerating
# with `TS_SMALL_STATE_THRESHOLD=128` saves 1.65 MiB here.
#
# It is a representation change only -- the automaton, and so every parse tree, is
# byte-identical. `vendor/README.md` has the procedure and the proof.
#
# Generated with tree-sitter-cli 0.26.13 at ABI 15, the ABI upstream ships,
# and the `tree_sitter/` headers come from vendor/tree-sitter-headers -- see the
# README there.
#
# `queries/` is deliberately not vendored, matching vendor/tree-sitter-vue.
# GitComet keeps its own queries in
# crates/gitcomet-ui-gpui/src/view/rows/diff_text/queries/.
[package]
name = "tree-sitter-c-sharp"
description = "C# grammar for tree-sitter"
version = "0.23.5"
repository = "https://github.com/tree-sitter/tree-sitter-c-sharp"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

# Upstream's dev-dependency, kept so `bindings/rust/lib.rs`'s own test module still
# builds. This crate is workspace-`exclude`d, so it only runs under
# `cargo test --manifest-path vendor/tree-sitter-c-sharp/Cargo.toml`. The version
# tracks `tree-sitter` in the root Cargo.toml.
[dev-dependencies]
tree-sitter = "0.27.0"
