[package]
name = "gpui_ce_render"
version = "0.1.0"
description = "A community fork of Zed's GPU-accelerated UI framework"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
path = "src/gpui_render.rs"

[dependencies]
gpui = { git = "https://github.com/Havunen/gpui-ce.git", rev = "f7474ab18033dee1e58770494c3b56afb3938b24", package = "gpui-ce", default-features = false }
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false, features = ["validation"] }

[target.'cfg(windows)'.build-dependencies]
windows-core = "0.100"
windows-link = "0.100"

[build-dependencies]
naga = { version = "=29.0.4", features = [
  "glsl-out",
  "hlsl-out",
  "msl-out",
  "wgsl-in",
] }
naga-old = { package = "naga", version = "24.0.0", features = [
  "hlsl-out",
  "wgsl-in",
] }
gpui = { git = "https://github.com/Havunen/gpui-ce.git", rev = "f7474ab18033dee1e58770494c3b56afb3938b24", package = "gpui-ce", default-features = false }
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", rev = "b2de16a1b81e67d76bc265c296184f882864badb", default-features = false, features = ["validation"] }

[dev-dependencies]
naga = { version = "=29.0.4", features = ["wgsl-in"] }
