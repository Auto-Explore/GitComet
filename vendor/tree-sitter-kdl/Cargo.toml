# Vendored from the `tree-sitter-kdl` v2.0.0 tag
# (https://github.com/tree-sitter-grammars/tree-sitter-kdl, MIT -- see LICENSE,
# fetched from the repository because the published tarball ships none).
#
# v2.0.0 adds KDL 2 and **still parses KDL 1**: bare `true`/`false`/`null` and
# `r#"..."#` raw strings keep working, all 84 of Zellij's v1 configs parse, and
# the official v1 suite goes 127/133 -> 131/133. The one v1 regression is
# `node r#"""#`. It also fixes two v1 bugs (raw strings containing `#` or `"`,
# and CR-only newlines) and the v2 corpus sample goes from 16 ERROR nodes to 2,
# both on lines that are not valid KDL.
#
# `queries/kdl_highlights.scm` had to be rewritten for it: `annotation_type` is
# gone, `node_children_comment` moved, and node patterns must be anchored on the
# `name:` field or the query takes tens of seconds to compile. That query and
# this grammar have to move together -- `language.rs` `.expect()`s the compile.
#
# Vendored rather than depended on, because the published crate has a normal
# dependency on `tree-sitter ~0.20`. `tree-sitter` declares `links`, so cargo
# will not resolve it alongside the workspace's 0.26 at any version -- the same
# blocker documented on `tree-sitter-clojure-orchard` in the root Cargo.toml.
# Vendoring drops the pin: the grammar is bound to whichever tree-sitter the
# workspace resolves through `tree-sitter-language`, which is what
# `bindings/rust/lib.rs` is rewritten to use.
#
# `src/` is generated by tree-sitter-cli 0.26.13 (ABI 15) from the `grammar.js`
# beside it, and matches upstream's own v2.0.0 output: STATE_COUNT 419,
# SYMBOL_COUNT 97, identical node-types.json. The `tree_sitter/` headers come
# from vendor/tree-sitter-headers -- see the README there.
#
# `queries/` is deliberately not vendored, matching vendor/tree-sitter-vue.
# GitComet keeps its own query in
# crates/gitcomet-ui-gpui/src/view/rows/diff_text/queries/.
[package]
name = "tree-sitter-kdl"
description = "KDL grammar for the tree-sitter parsing library"
version = "1.1.0"
repository = "https://github.com/amaanq/tree-sitter-kdl"
edition = "2021"
license = "MIT"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
tree-sitter-build = { path = "../tree-sitter-build" }

[dev-dependencies]
tree-sitter = "0.27.0"
