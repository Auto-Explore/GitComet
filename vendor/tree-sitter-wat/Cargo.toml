# Vendored from https://github.com/wasm-lsp/tree-sitter-wasm
# at rev 2ca28a9f9d709847bf7a3de0942a84e912f59088 (Apache-2.0 WITH LLVM-exception, see LICENSE).
#
# Vendored because there is no usable crates.io release: nothing on crates.io provides a WebAssembly text grammar at all. Upstream is a
# multi-grammar npm repository with no Rust bindings; `wat/` is the half taken
# here. One `grammar.js` edit was needed and is marked `GitComet:` -- the
# `u{...}` escape had unescaped braces, which the modern CLI reads as a
# repetition quantifier and rejects, so the grammar could not be regenerated and
# upstream's committed parser was stale at ABI 13.
#
# `src/` is generated by tree-sitter-cli 0.26.13 from the `grammar.js` beside it,
# so regenerating is `tree-sitter generate` in this directory.
#
# Compatibility with the workspace tree-sitter (see `tree-sitter` in the root
# Cargo.toml) is a hard requirement, enforced by the
# `vendored_grammars_are_abi_compatible_with_workspace_tree_sitter` test in
# crates/gitcomet-ui-gpui/src/view/rows/diff_text/syntax.rs. Depending on
# `tree-sitter-language` rather than `tree-sitter` is what keeps that true: the
# grammar exposes a bare `LanguageFn` bound to whichever tree-sitter the
# workspace resolves.
#
# `queries/` is deliberately not vendored, matching vendor/tree-sitter-vue.
# GitComet keeps its own query in
# crates/gitcomet-ui-gpui/src/view/rows/diff_text/queries/.
[package]
name = "tree-sitter-wat"
description = "WebAssembly text format grammar for the tree-sitter parsing library"
version = "0.1.0"
repository = "https://github.com/wasm-lsp/tree-sitter-wasm"
edition = "2021"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
# The build script body, shared by every vendored grammar.
tree-sitter-build = { path = "../tree-sitter-build" }

# Tracks `tree-sitter` in the root Cargo.toml, so that
# `cargo test --manifest-path vendor/tree-sitter-wat/Cargo.toml` -- the check
# whoever regenerates this grammar wants to run -- builds the same version the
# workspace does.
[dev-dependencies]
tree-sitter = "0.26.13"
