# Vendored from gpui-ce 46e1ede350cc95071b389e83831e18e7d114bbaf.
# Workspace dependencies expanded without changing their source.

[package]
name = "gpui-ce"
autotests = false
version = "0.2.2"
edition = "2024"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "A community fork of Zed's GPU-accelerated UI framework"
repository = "https://github.com/gpui-ce/gpui-ce"
publish = true
license = "Apache-2.0"
homepage = "https://gpui-ce.github.io/"
readme = "README.md"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]
rust-version = "1.95"
metadata = { "cargo-shear" = { "ignored" = ["bindgen", "font-kit", "getrandom", "objc2", "objc2-metal", "tracing"], "ignored-paths" = ["src/_ownership_and_data_flow.rs"] } }

[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
custom-gpu = []
wgpu-surfaces = []
test-support = ["leak-detection", "collections/test-support", "wayland", "x11", "proptest"]
bench-support = ["profiler", "dep:criterion"]
bench = ["bench-support"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
wayland = []
x11 = []
screen-capture = ["dep:windows-capture"]
windows-manifest = ["dep:embed-resource"]
profiler = ["dep:hdrhistogram"]
stacker = ["dep:stacksafe"]
embedded-assets = ["dep:rust-embed"]
hot-patching = ["dep:dioxus-devtools", "dep:subsecond"]

[lib]
name = "gpui"
path = "src/gpui.rs"
doctest = false

# Keep portable upstream integration tests in workspace CI. The omitted
# renderer_source_audit inspects sibling renderer crates in the upstream
# checkout; those crates are pinned Git dependencies, not vendored here.
[[test]]
name = "action_macros"
path = "tests/action_macros.rs"

[[test]]
name = "derive_context"
path = "tests/derive_context.rs"

[[test]]
name = "derive_element_traits"
path = "tests/derive_element_traits.rs"

[[test]]
name = "derive_inspector_reflection"
path = "tests/derive_inspector_reflection.rs"

[[test]]
name = "render_macro"
path = "tests/render_macro.rs"

[[test]]
name = "test_macro_cleanup"
path = "tests/test_macro_cleanup.rs"

[dependencies]
accesskit = { "version" = "0.25", "features" = ["enumn"] }
anyhow = { "version" = "1" }
async-task = { "version" = "4.7" }
backtrace = { "version" = "0.3", "optional" = true }
bitflags = { "version" = "2", "default-features" = false }
collections = { "version" = "0.2.2", "package" = "gpui_ce_collections", "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }
criterion = { "version" = "0.8", "features" = ["html_reports"], "optional" = true }
ctor = { "version" = "1.0" }
derive_more = { "version" = "2.1", "features" = ["add", "add_assign", "deref", "deref_mut", "display", "from_str", "mul", "mul_assign", "not"] }
derive_setters = { "version" = "0.1.9" }
etagere = { "version" = "0.3" }
futures = { "version" = "0.3" }
futures-concurrency = { "version" = "7.7" }
gpui_macros = { "version" = "0.1.0", "package" = "gpui_ce_macros", "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }
gpui_shared_string = { "version" = "0.1.0", "package" = "gpui_ce_shared_string", "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }
http = { "version" = "1" }
image = { "version" = "0.25" }
inventory = { "version" = "0.3" }
itertools = { "version" = "0.15" }
log = { "version" = "0.4", "features" = ["kv_unstable_serde", "serde"] }
num_cpus = { "version" = "1" }
parking = { "version" = "2" }
parking_lot = { "version" = "0.12" }
palette = { "version" = "0.7", "features" = ["serializing"] }
postage = { "version" = "0.5", "features" = ["futures-traits"] }
proptest = { "version" = "1.11", "features" = ["attr-macro"], "optional" = true }
chrono = { "version" = "0.4", "features" = ["serde"] }
profiling = { "version" = "1" }
rand = { "version" = "0.10" }
raw-window-handle = { "version" = "0.6" }
regex = { "version" = "1" }
refineable = { "version" = "0.2.2", "package" = "gpui_ce_refineable", "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }
scheduler = { "version" = "0.2.2", "package" = "gpui_ce_scheduler", "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }
resvg = { "version" = "0.48", "default-features" = false, "features" = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
rust-embed = { "version" = "8.12", "optional" = true }
usvg = { "version" = "0.48", "default-features" = false }
skrifa = { "version" = "0.47" }
schemars = { "version" = "1.2", "features" = ["indexmap2"] }
seahash = { "version" = "4" }
serde = { "version" = "1", "features" = ["derive", "rc"] }
serde_json = { "version" = "1", "features" = ["raw_value"] }
slotmap = { "version" = "1.1" }
smallvec = { "version" = "1", "features" = ["union", "const_new"] }
async-channel = { "version" = "2.5" }
stacksafe = { "version" = "1.0", "optional" = true }
strum = { "version" = "0.28", "features" = ["derive"] }
sum_tree = { "version" = "0.2.2", "package" = "gpui_ce_sum_tree", "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }
taffy = { "version" = "=0.14.0", "default-features" = false, "features" = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "calc", "content_size", "detailed_layout_info"] }
thiserror = { "version" = "2" }
tracing = { "version" = "0.1.44", "features" = ["attributes"] }
gpui_util = { "version" = "0.2.6", "package" = "gpui_ce_util", "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }
unicode-segmentation = { "version" = "1.13" }
hdrhistogram = { "version" = "7", "optional" = true }
waker-fn = { "version" = "1.2" }
lyon = { "version" = "1" }
pin-project = { "version" = "1" }
spin = { "version" = "0.12" }
pollster = { "version" = "1" }
url = { "version" = "2" }
uuid = { "version" = "1", "features" = ["v4", "v5", "v7", "serde"] }
web-time = { "version" = "1.1" }
heapless = { "version" = "0.9" }

[target."cfg(target_family = \"wasm\")".dependencies]
getrandom = { "version" = "0.4", "features" = ["wasm_js"] }
uuid = { "version" = "1", "features" = ["v4", "v5", "v7", "serde", "js"] }

[target."cfg(target_family = \"wasm\")".dev-dependencies]
wasm-bindgen = { "version" = "0.2" }
web-sys = { "version" = "0.3", "features" = ["console"] }

[target."cfg(not(target_family = \"wasm\"))".dependencies]
dioxus-devtools = { "version" = "=0.7.10", "features" = ["serve"], "optional" = true }
subsecond = { "version" = "=0.7.10", "optional" = true }

[target."cfg(not(target_family = \"wasm\"))".dev-dependencies]
proptest = { "version" = "1.11", "features" = ["attr-macro"] }

[target."cfg(target_os = \"macos\")".dependencies]
core-video = { "version" = "0.6", "features" = ["metal"] }
core-text = { "version" = "22" }
font-kit = { "git" = "https://github.com/Havunen/font-kit", "rev" = "cc6f86949e40ef3a5e9b2063f8127cdcb72d7ac4", "package" = "font-kit", "version" = "0.14.3-1", "optional" = true, "features" = ["freetype-bundled"] }
foreign-types = { "version" = "0.5" }
log = { "version" = "0.4", "features" = ["kv_unstable_serde", "serde"] }
objc2 = { "version" = "0.6", "optional" = true }
objc2-metal = { "version" = "0.3", "optional" = true }

[target."cfg(target_os = \"macos\")".build-dependencies]
bindgen = { "version" = "0.73" }

[target."cfg(target_os = \"windows\")".dependencies]
windows-capture = { "version" = "2.0", "optional" = true }
windows-core = { "version" = "0.100" }

[dev-dependencies]
accesskit_consumer = { "version" = "0.39" }
backtrace = { "version" = "0.3" }
smol = { "version" = "2" }
collections = { "version" = "0.2.2", "package" = "gpui_ce_collections", "features" = ["test-support"], "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }
env_logger = { "version" = "0.11" }
gpui_platform = { "version" = "0.1.0", "package" = "gpui_ce_platform", "features" = ["font-kit", "wayland", "x11"], "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }
gpui_util = { "version" = "0.2.6", "package" = "gpui_ce_util", "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }
lyon = { "version" = "1", "features" = ["extra"] }
proptest = { "version" = "1.11", "features" = ["attr-macro"] }
rand = { "version" = "0.10" }
scheduler = { "version" = "0.2.2", "package" = "gpui_ce_scheduler", "features" = ["test-support"], "git" = "https://github.com/Havunen/gpui-ce.git", "rev" = "46e1ede350cc95071b389e83831e18e7d114bbaf" }

[build-dependencies]
embed-resource = { "version" = "3", "optional" = true }

