[workspace]
resolver = "3"
members = [
  "crates/gitcomet",
  "crates/gitcomet-app",
  "crates/gitcomet-base",
  "crates/gitcomet-conflict-resolver",
  "crates/gitcomet-core",
  "crates/gitcomet-difftastic",
  "crates/gitcomet-diagrams",
  "crates/gitcomet-fonts",
  "crates/gitcomet-extension-api",
  "crates/gitcomet-extension-example",
  "crates/gitcomet-extension-example-app",
  "crates/gitcomet-git-gix",
  "crates/gitcomet-markdown",
  "crates/gitcomet-perf",
  "crates/gitcomet-state",
  "crates/gitcomet-fs-watch",
  "crates/gitcomet-syntax",
  "crates/gitcomet-text",
  "crates/gitcomet-tree-sitter-alloc",
  "crates/gitcomet-ui-gpui",
  "crates/gitcomet-ui-kit",
  "crates/gitcomet-ui-media",
  "crates/gitcomet-ui-terminal",
  # Upstream source, a member so its grammars resolve to the workspace crates.
  # See vendor/README.md.
  "vendor/difftastic",
]
exclude = [
  "vendor/block",
  "vendor/block/test_utils",
  "vendor/mermaid-rs-renderer",
  "crates/gitcomet-filesystem-native",
  "crates/win32-window-utils",
  "vendor/tree-sitter-asm",
  "vendor/tree-sitter-build",
  "vendor/tree-sitter-c-sharp",
  "vendor/tree-sitter-caddyfile",
  "vendor/tree-sitter-cil",
  "vendor/tree-sitter-coffee",
  "vendor/tree-sitter-cpp",
  "vendor/tree-sitter-crontab",
  "vendor/tree-sitter-css",
  "vendor/tree-sitter-csv",
  "vendor/tree-sitter-cue",
  "vendor/tree-sitter-dhall",
  "vendor/tree-sitter-ebnf",
  "vendor/tree-sitter-fsharp",
  "vendor/tree-sitter-gitignore",
  "vendor/tree-sitter-haskell",
  "vendor/tree-sitter-html",
  "vendor/tree-sitter-janet-simple",
  "vendor/tree-sitter-jinja-dialects",
  "vendor/tree-sitter-julia",
  "vendor/tree-sitter-just",
  "vendor/tree-sitter-kdl",
  "vendor/tree-sitter-kotlin-sg",
  "vendor/tree-sitter-latex",
  "vendor/tree-sitter-objc",
  "vendor/tree-sitter-ocaml",
  "vendor/tree-sitter-php",
  "vendor/tree-sitter-powershell",
  "vendor/tree-sitter-properties",
  "vendor/tree-sitter-ron",
  "vendor/tree-sitter-ruby",
  "vendor/tree-sitter-rust",
  "vendor/tree-sitter-scala",
  "vendor/tree-sitter-sequel",
  "vendor/tree-sitter-smali",
  "vendor/tree-sitter-solidity",
  "vendor/tree-sitter-spirv",
  "vendor/tree-sitter-swift",
  "vendor/tree-sitter-typescript",
  "vendor/tree-sitter-v",
  "vendor/tree-sitter-vue",
  "vendor/tree-sitter-wat",
]

default-members = [
  "crates/gitcomet",
  "crates/gitcomet-app",
  "crates/gitcomet-base",
  "crates/gitcomet-conflict-resolver",
  "crates/gitcomet-core",
  "crates/gitcomet-git-gix",
  "crates/gitcomet-markdown",
  "crates/gitcomet-perf",
  "crates/gitcomet-state",
  "crates/gitcomet-syntax",
  "crates/gitcomet-text",
  "crates/gitcomet-ui-gpui",
  "crates/gitcomet-ui-kit",
  "crates/gitcomet-ui-media",
  "crates/gitcomet-ui-terminal",
  "vendor/difftastic",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["AutoExplore Oy <info@autoexplore.ai>"]
repository = "https://github.com/Auto-Explore/GitComet"
rust-version = "1.99.1"

[patch.crates-io]
# block 0.1.6 has no released fix for its uninhabited extern class static.
block = { path = "vendor/block" }

[workspace.dependencies]
# Internal crates
gitcomet-app = { path = "crates/gitcomet-app", default-features = false }
gitcomet-base = { path = "crates/gitcomet-base" }
gitcomet-conflict-resolver = { path = "crates/gitcomet-conflict-resolver" }
gitcomet-core = { path = "crates/gitcomet-core" }
gitcomet-difftastic = { path = "crates/gitcomet-difftastic" }
gitcomet-diagrams = { path = "crates/gitcomet-diagrams" }
gitcomet-fonts = { path = "crates/gitcomet-fonts" }
gitcomet-extension-api = { path = "crates/gitcomet-extension-api" }
gitcomet-git-gix = { path = "crates/gitcomet-git-gix" }
gitcomet-markdown = { path = "crates/gitcomet-markdown" }
gitcomet-perf = { path = "crates/gitcomet-perf" }
gitcomet-state = { path = "crates/gitcomet-state" }
gitcomet-syntax = { path = "crates/gitcomet-syntax" }
gitcomet-text = { path = "crates/gitcomet-text" }
gitcomet-tree-sitter-alloc = { path = "crates/gitcomet-tree-sitter-alloc" }
gitcomet-ui-gpui = { path = "crates/gitcomet-ui-gpui", default-features = false }
gitcomet-ui-kit = { path = "crates/gitcomet-ui-kit" }
gitcomet-ui-media = { path = "crates/gitcomet-ui-media" }
gitcomet-ui-terminal = { path = "crates/gitcomet-ui-terminal" }

# External crates
alacritty_terminal = "0.26"
anyhow = "1"
# `string`: the command's name and version come from the product identity.
clap = { version = "4.6.7", features = ["derive", "string"] }
criterion = "0.8.2"
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# Charset guess for files that are not UTF-8 (the detector Firefox uses).
chardetng = { version = "1.0.0", default-features = false }
# Runs the tree-sitter allocator install before `main` in every binary that
# links gitcomet-tree-sitter-alloc, tests included, so no process ever switches
# allocators while tree-sitter is already holding blocks. Already in the graph
# via gpui, so this adds no new compilation.
ctor = "1.0.13"
# Groovy grammar: the `tree-sitter-groovy` crate name is taken by amaanq's fork,
# which ships no highlights query. This one does.
dekobon-tree-sitter-groovy = "0.3.0"
# Vendored as a library; see vendor/README.md.
difftastic = { path = "vendor/difftastic" }
# Already in the tree via gix-filter; decodes and encodes non-UTF-8 file text.
encoding_rs = { version = "0.8.42", default-features = false, features = ["alloc", "fast-legacy-encode"] }
faster-hex = { version = "1.0.0", default-features = false, features = ["std"] }
# Already in the tree via gix-index; the timestamp type of an in-memory index.
filetime = "0.2.29"
fnv = "1.0.7"
fontdb = "0.24.0"
fs2 = "0.4.3"
futures = "0.3.34"
gix = { version = "0.90.0", default-features = false, features = ["max-performance", "zlib-sirocco", "comfort", "basic", "status", "blame", "sha1", "sha256"] }
# Already in the tree via gix; Git-compatible quoting for attribute patterns.
gix-quote = "0.10.1"
# Git's ref-name rules for branch names the UI is about to hand to git. Already
# in the graph through gix, so this adds no new compilation.
gix-validate = "0.13.1"
gpui = { package = "gpui-ce", git = "https://github.com/Havunen/gpui-ce.git", rev = "81b1e374d98a356f6dcdd38d4466739edde6b866" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/Havunen/gpui-ce.git", rev = "81b1e374d98a356f6dcdd38d4466739edde6b866", features = ["font-kit"] }
gpui_wgpu = { package = "gpui_ce_wgpu", git = "https://github.com/Havunen/gpui-ce.git", rev = "81b1e374d98a356f6dcdd38d4466739edde6b866" }
gpui_parley = { package = "gpui_ce_parley", git = "https://github.com/Havunen/gpui-ce.git", rev = "81b1e374d98a356f6dcdd38d4466739edde6b866", default-features = false }
gpui_shared_string = { package = "gpui_ce_shared_string", git = "https://github.com/Havunen/gpui-ce.git", rev = "81b1e374d98a356f6dcdd38d4466739edde6b866" }
gpui_sum_tree = { package = "gpui_ce_sum_tree", git = "https://github.com/Havunen/gpui-ce.git", rev = "81b1e374d98a356f6dcdd38d4466739edde6b866" }
image = "0.25.10"
fast_image_resize = { version = "6.1.0", features = ["image"] }
# Already in the dependency graph; merges sorted reference streams lazily.
itertools = "0.15.0"
# Already in the tree via gix-date; used directly for system-timezone lookups.
jiff = "0.2"
log = "0.4.34"
lru = "0.19"
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer", version = "0.3.1", default-features = false }
roxmltree = "0.21"
# git-annex object paths are hashed with MD5 (not for security).
md-5 = "0.11"
memchr = "2.8.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
notify = "9.0.0-rc.6"
palette = "0.7.7"
percent-encoding = "2.3.2"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "creation-flags", "job-object", "process-group"] }
raw-window-handle = "0.6"
regex = "1.13.1"
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }
rustc-hash = "2.1.3"
rustfs-mimalloc = "0.7.2"
rustfs-mimalloc-sys = "0.7.2"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
same-file = "1.0.6"
semver = "1.0.28"
sha2 = "0.11.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
smallvec = "1.16.4"
smol = "2.0.2"
stats_alloc = { version = "0.1.10", features = ["nightly"] }
strsim = "0.11.1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0"
tree-sitter = "0.27.1"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
# Fifteen of the grammars below are `path = "vendor/..."` purely to shrink the
# release binary: they are upstream's source, regenerated with a larger
# small-state threshold. tree-sitter's generator gives a parse state either a
# dense `ts_parse_table` row (SYMBOL_COUNT * 2 bytes) or a compact scanned entry,
# switching at `min(64, symbol_count / 2)` -- and that 64 is the break-even only
# up to 128 symbols, so every large grammar pays for thousands of dense rows it
# does not need. Regenerating at 128 took the 19 parsers that reach the binary
# from 67.8 MB to 45.0 MB of parse tables -- the whole of the release build's
# 22.7 MB drop -- for ~1.6-6.7% more parse time, and is representation-only: the
# automaton and every parse tree are unchanged, which is verified per grammar
# against upstream. vendor/README.md has the procedure, the proof, and the one
# grammar this is *not* safe for; each crate's Cargo.toml header has its own
# numbers.
tree-sitter-ada = "0.1.0"
# Vendored, not from crates.io: the grammar needed a `mnemonic` token so an
# arm64 `b.eq` is one node instead of an ERROR, and upstream has not changed.
# See vendor/tree-sitter-asm/Cargo.toml for the full list of edits.
tree-sitter-asm = { path = "vendor/tree-sitter-asm" }
tree-sitter-bash = "0.25.1"
tree-sitter-bicep = "1.1.0"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = { path = "vendor/tree-sitter-c-sharp" }
# Clojure grammar. Not `tree-sitter-clojure`: that crate has a normal dependency
# on `tree-sitter = 0.25.6`, and because tree-sitter declares `links`, cargo will
# not resolve it alongside 0.26 at any version. `tree-sitter-just` is blocked the
# same way (`~0.25.5`), so it is not in the tree either.
tree-sitter-clojure-orchard = "0.2.8"
# Vendored: upstream is archived and unpublished. See its Cargo.toml.
tree-sitter-caddyfile = { path = "vendor/tree-sitter-caddyfile" }
# Written here rather than vendored: no CIL or crontab grammar exists upstream.
tree-sitter-cil = { path = "vendor/tree-sitter-cil" }
tree-sitter-cmake = "0.7.5"
tree-sitter-commonlisp = "0.4.1"
# Dockerfile / Containerfile. The crate is named for the OCI-neutral spelling but
# the grammar is the Docker one.
tree-sitter-containerfile = "0.9.2"
# Vendored: no crates.io release. See its Cargo.toml header.
tree-sitter-coffee = { path = "vendor/tree-sitter-coffee" }
tree-sitter-cpp = { path = "vendor/tree-sitter-cpp" }
tree-sitter-crontab = { path = "vendor/tree-sitter-crontab" }
# The five below are vendored: each pins `tree-sitter ~0.20`, which `links`
# makes unresolvable alongside 0.26. See their Cargo.toml headers.
tree-sitter-csv = { path = "vendor/tree-sitter-csv" }
tree-sitter-cue = { path = "vendor/tree-sitter-cue" }
# Vendored to give custom properties a rule: `--json: {...}` parsed as a nested
# rule set and the ERROR took the rest of the block. See
# vendor/tree-sitter-css/Cargo.toml.
tree-sitter-css = { path = "vendor/tree-sitter-css" }
tree-sitter-dart = "0.2.0"
tree-sitter-devicetree = "0.15.0"
tree-sitter-dhall = { path = "vendor/tree-sitter-dhall" }
tree-sitter-diff = "0.1.0"
tree-sitter-ebnf = { path = "vendor/tree-sitter-ebnf" }
tree-sitter-elisp = "1.7.2"
tree-sitter-elixir = "0.3.5"
tree-sitter-elm = "5.9.4"
tree-sitter-erlang = "0.21.0"
tree-sitter-fish = "3.6.0"
tree-sitter-fsharp = { path = "vendor/tree-sitter-fsharp" }
tree-sitter-gitcommit = { git = "https://github.com/zed-industries/tree-sitter-git-commit", rev = "88309716a69dd13ab83443721ba6e0b491d37ee9" }
tree-sitter-gleam = "1.0.0"
tree-sitter-go = "0.25.0"
tree-sitter-gomod = { git = "https://github.com/camdencheek/tree-sitter-go-mod", rev = "2e886870578eeba1927a2dc4bd2e2b3f598c5f9a" }
tree-sitter-gowork = { git = "https://github.com/zed-industries/tree-sitter-go-work", rev = "acb0617bf7f4fda02c6217676cc64acb89536dc7" }
tree-sitter-haskell = { path = "vendor/tree-sitter-haskell" }
# Vendored: no crates.io release, no Rust bindings upstream.
tree-sitter-gitignore = { path = "vendor/tree-sitter-gitignore" }
tree-sitter-hcl = "1.1.0"
# Vendored for a scanner fix: upstream closed a `<script>` on the characters
# `</script` alone, where the spec requires whitespace, `/` or `>` after the
# tag name. See vendor/tree-sitter-html/Cargo.toml.
tree-sitter-html = { path = "vendor/tree-sitter-html" }
# INI, and the several config formats that are INI without saying so:
# `.editorconfig`, systemd units, and git's own config files.
tree-sitter-ini = "1.4.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-java = "0.23.5"
# From difftastic's vendored parsers, shared with vendor/difftastic. See the
# crate headers.
tree-sitter-janet-simple = { path = "vendor/tree-sitter-janet-simple" }
tree-sitter-jinja-dialects = { path = "vendor/tree-sitter-jinja-dialects" }
tree-sitter-jsdoc = "0.25.0"
tree-sitter-jsonnet = "0.0.1"
tree-sitter-json = "0.24.8"
# Vendored, not from crates.io: the published crate depends on
# `tree-sitter = ~0.25.5` and `links` makes that unresolvable alongside 0.26 --
# the same blocker as `tree-sitter-clojure`, above.
tree-sitter-just = { path = "vendor/tree-sitter-just" }
tree-sitter-kdl = { path = "vendor/tree-sitter-kdl" }
tree-sitter-julia = { path = "vendor/tree-sitter-julia" }
tree-sitter-kotlin-sg = { path = "vendor/tree-sitter-kotlin-sg" }
tree-sitter-latex = { path = "vendor/tree-sitter-latex" }
tree-sitter-llvm = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", rev = "9a23c1a96c0513d8fc6520972beedd419a973539" }
tree-sitter-newick = "1.1.0"
tree-sitter-nix = "0.3.0"
tree-sitter-objc = { path = "vendor/tree-sitter-objc" }
tree-sitter-ocaml = { path = "vendor/tree-sitter-ocaml" }
# Ships a parser but no highlights query; GitComet authors one. Deliberately *not*
# vendored for the small-state retune: tree-sitter-cli 0.26.13 builds a different
# automaton from this grammar than the CLI upstream used (STATE_COUNT 4634 rather
# than 4698, from grammar.js as well as grammar.json), so regenerating it changes
# parse trees -- `pod.pl` renests a `scalar_variable` -- and would break the
# representation-only guarantee the other grammars are held to. 1.19 MiB is not
# worth an unverified change to Perl parsing.
# The crates.io 1.1.2 package has `tree-sitter = "^0.26.3"` as a regular
# dependency, which conflicts with the workspace's 0.27 C library because
# `tree-sitter` declares `links = "tree-sitter"`. Upstream's post-release
# revision moves it to dev-dependencies (and changes only Cargo.toml); pin it
# until it releases that fix.
tree-sitter-perl = { git = "https://github.com/ganezdragon/tree-sitter-perl", rev = "5b97493ce70686e22ec8b9ea261437147e342b49" }
tree-sitter-php = { path = "vendor/tree-sitter-php" }
tree-sitter-powershell = { path = "vendor/tree-sitter-powershell" }
# Pascal and Protobuf ship no highlights query; GitComet authors both.
tree-sitter-pascal = "0.10.2"
# Vendored for a scanner fix: 0.3.0 keeps its EOF flag in a C global, and two
# threads parsing `.properties` at once can loop forever. See
# vendor/tree-sitter-properties/Cargo.toml.
tree-sitter-properties = { path = "vendor/tree-sitter-properties" }
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.25.0"
tree-sitter-qmljs = "0.3.1"
tree-sitter-r = "1.3.0"
tree-sitter-racket = "0.25.0"
tree-sitter-regex = "0.25.0"
tree-sitter-ron = { path = "vendor/tree-sitter-ron" }
# Vendored for a grammar fix: a `=begin` block comment ended at any `=end`,
# including mid-line, where Ruby requires column 0. See
# vendor/tree-sitter-ruby/Cargo.toml.
tree-sitter-ruby = { path = "vendor/tree-sitter-ruby" }
tree-sitter-rust = { path = "vendor/tree-sitter-rust" }
tree-sitter-scala = { path = "vendor/tree-sitter-scala" }
tree-sitter-scheme = "0.25.0"
tree-sitter-sequel = { path = "vendor/tree-sitter-sequel" }
tree-sitter-sfapex = "3.0.1"
tree-sitter-smali = { path = "vendor/tree-sitter-smali" }
# Vendored to fix its highlight query for the workspace tree-sitter. See
# vendor/tree-sitter-solidity/Cargo.toml.
tree-sitter-solidity = { path = "vendor/tree-sitter-solidity" }
# Vendored: no crates.io release, no Rust bindings upstream.
tree-sitter-spirv = { path = "vendor/tree-sitter-spirv" }
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-swift = { path = "vendor/tree-sitter-swift" }
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = { path = "vendor/tree-sitter-typescript" }
tree-sitter-v = { path = "vendor/tree-sitter-v" }
tree-sitter-vhdl = "1.4.0"
tree-sitter-vue = { path = "vendor/tree-sitter-vue" }
# Vendored: nothing on crates.io provides a WebAssembly text grammar.
tree-sitter-wat = { path = "vendor/tree-sitter-wat" }
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip"] }
url = "2.5.8"
wayland-client = "0.31.15"
x11-clipboard = "0.9.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(gitcomet_probe_legacy_repository_api)"] }

[profile.dev]
incremental = true
opt-level = 0

# Dependencies use the same settings under `cargo build` and `cargo test` (the
# test profile inherits this), so switching between them reuses every artifact.
[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# Keep application code quick to rebuild while optimizing the layout/render
# dependencies. Windows measurements and reproduction: scripts/profiling/README.md.
[profile.dev.package.gpui-ce]
opt-level = 2

[profile.dev.package.gpui_ce_windows]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

# Native text shaping also runs on the UI thread. Font-table reads and glyph
# substitution dominated first-use repository-picker draws in the Linux trace.
[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.read-fonts]
opt-level = 2

[profile.dev.package.font-types]
opt-level = 2

# Text decoding runs on every non-UTF-8 file load; at opt-level 0 it is
# tens of times slower than the file read itself.
[profile.dev.package.encoding_rs]
opt-level = 2

[profile.dev.package.chardetng]
opt-level = 2

# A structural diff gets five seconds; unoptimized, Difftastic takes several times
# longer than a release build and misses that on larger files.
[profile.dev.package.difftastic]
opt-level = 2
debug = "line-tables-only"

[profile.test]
opt-level = 1

# CI avoids generating and packaging debugger symbols on ephemeral runners.
# Keep algorithm/dependency optimization; the large UI crate favors fast builds.
[profile.ci-test]
inherits = "dev"
opt-level = 1
debug = 0
split-debuginfo = "off"
lto = "off"
codegen-units = 256
incremental = false
debug-assertions = true
overflow-checks = true

# Overrides the inherited dev dependency debug info.
[profile.ci-test.package."*"]
debug = 0

[profile.ci-test.package.gitcomet-ui-gpui]
opt-level = 0

[profile.ci-test.package.gpui-ce]
opt-level = 1

[profile.ci-test.package.gpui_ce_windows]
opt-level = 1

[profile.ci-test.package.taffy]
opt-level = 1

[profile.ci-test.package.difftastic]
debug = 0

# Unoptimized compile/link coverage only. Actual performance measurements use
# release or bench with the production release settings below.
[profile.ci-bench]
inherits = "release"
opt-level = 0
debug = 0
split-debuginfo = "off"
lto = "off"
codegen-units = 256
incremental = false

[profile.release]
lto = "fat"
codegen-units = 1
# Debug info is deliberately NOT enabled here. Only the release jobs extract
# symbols, and they turn it on per-job with CARGO_PROFILE_RELEASE_DEBUG next to
# the CARGO_PROFILE_RELEASE_STRIP / _SPLIT_DEBUGINFO overrides. Setting it in the
# manifest would also tax every `cargo bench` — [profile.bench] inherits this
# profile — with fat-LTO debug info that is generated and then discarded.
# See `docs/crash-symbolication.md`.
#
# `debuginfo` drops the DWARF from the shipped binary but keeps the symbol
# table, so on ELF and Mach-O GitComet's own crash log (`crashlog.rs`,
# `Backtrace::force_capture`) reports function names instead of `<unknown>`.
# Measured cost on the x86_64 Linux release binary: 106.8 -> 115.0 MiB raw,
# 27.5 -> 28.7 MiB compressed. This buys nothing on Windows, where symbols live
# in the `.pdb` rather than the image and dbghelp needs that file either way —
# Windows crash logs are resolved from the symbol store instead.
#
# The Linux release job overrides this at build time (`strip = "none"`) so the
# DWARF survives long enough to be extracted, then strips back down to this
# level before packaging. macOS needs no override because
# `split-debuginfo = "packed"` puts the DWARF in a `.dSYM` bundle, and Windows
# needs none because MSVC keeps debug info in the `.pdb` regardless — what
# produces that file is `CARGO_PROFILE_RELEASE_DEBUG`, not `strip`.
# See `.github/workflows/build-release-artifacts.yml`.
strip = "debuginfo"

[profile.release-with-debug]
inherits = "release"
debug = 2
strip = "none"
